<style>

    --text-1: #1A1A1A; --text-2: #555555; --text-3: #AEAEB2;

  /* 로그인 / 공개 페이지 */

  .inline { display: flex; gap: 8px; }
  .counter { text-align: right; font-size: 12px; color: var(--text-3); margin-top: 4px; }
  .done-box { text-align: center; padding: 50px 20px; }
  .done-icon { font-size: 48px; }

  /* 레이아웃 */

  .sidebar { width: 244px; background: var(--bg-1); border-right: 1px solid var(--border-1); padding: 22px 12px; position: fixed; inset: 0 auto 0 0; display: flex; flex-direction: column; overflow-y: auto; }

  .nav-item:hover { background: var(--bg-2); }
  .nav-item.active { background: var(--primary-bg); color: var(--primary); font-weight: 700; }
  .nav-item .chev { margin-left: auto; font-size: 9px; color: var(--text-3); transition: transform 0.15s; }
  .nav-item .chev.open { transform: rotate(90deg); }
  .nav-subitem { display: block; width: 100%; text-align: left; border: none; background: none; padding: 8px 12px 8px 40px; border-radius: 9px; font-size: 13px; font-weight: 500; color: var(--text-2); margin-bottom: 1px; }
  .nav-subitem:hover { background: var(--bg-2); }
  .nav-subitem.active { background: var(--primary-bg); color: var(--primary); font-weight: 700; }
  .sidebar-bottom { margin-top: auto; padding: 12px; border-top: 1px solid var(--border-1); }

  .sidebar.collapsed .sidebar-top { justify-content: center; padding: 2px 0 20px; }
  .sidebar-logo-img { height: 30px; cursor: pointer; display: block; }
  .sidebar-toggle { flex-shrink: 0; width: 28px; height: 28px; border: 1px solid var(--border-1); background: var(--bg-1); border-radius: 8px; display: inline-flex; align-items: center; justify-content: center; cursor: pointer; color: var(--text-2); }
  .sidebar-toggle:hover { background: var(--bg-2); }
  .sidebar-avatar { width: 36px; height: 36px; border-radius: 50%; background: var(--primary); color: #fff; display: flex; align-items: center; justify-content: center; font-weight: 700; font-size: 14px; }
  .page-title { font-size: 22px; font-weight: 800; margin-bottom: 4px; }

  .badge-blue { background: var(--primary-bg); color: var(--primary); }
  .badge-green { background: var(--green-bg); color: var(--green); }
  .badge-red { background: var(--red-bg); color: var(--red); }
  .badge-orange { background: var(--orange-bg); color: var(--orange); }
  .badge-gray { background: var(--bg-2); color: var(--text-2); }
  .badge-purple { background: var(--purple-bg); color: var(--purple); }
  .badge-mini { padding: 2px 7px; font-size: 11px; margin-left: 6px; }

  .tabs { display: flex; gap: 8px; margin-bottom: 16px; flex-wrap: wrap; }
  .tab { border: 1px solid var(--border-1); background: var(--bg-1); color: var(--text-2); border-radius: 99px; padding: 7px 15px; font-size: 13px; font-weight: 600; }

  .pager button.active { background: var(--primary); border-color: var(--primary); color: #fff; }
  .pager button:disabled { opacity: .4; cursor: not-allowed; }

  /* ===== 우측 슬라이드 패널 (모든 모달 공통) ===== */
  @keyframes slidePanelIn { from { transform: translateX(100%); } to { transform: translateX(0); } }
  .modal-overlay { position: fixed; inset: 0; background: var(--modal-overlay); display: flex; align-items: stretch; justify-content: flex-end; z-index: 100; }
  .modal, .slide-panel { background: var(--bg-1); height: 100vh; width: 480px; max-width: 100vw; display: flex; flex-direction: column; overflow: hidden; box-shadow: -8px 0 30px rgba(0,0,0,.12); animation: slidePanelIn .3s ease; }
  .modal.lg { width: 600px; }
  .modal.xl { width: 720px; }
  .modal.fixed { height: 100vh; }
  .modal-head { flex-shrink: 0; display: flex; align-items: center; justify-content: space-between; gap: 12px; padding: 20px 24px; border-bottom: 1px solid var(--border-1); }
  .modal-head h3 { font-size: 17px; font-weight: 800; margin: 0; }
  .modal-close { background: none; border: none; color: var(--text-3); display: inline-flex; align-items: center; justify-content: center; width: 30px; height: 30px; border-radius: 8px; }
  .modal-close:hover { background: var(--bg-2); color: var(--text-1); }
  .modal-body { flex: 1; min-height: 0; overflow-y: auto; padding: 24px; display: flex; flex-direction: column; }
  .modal-actions { display: flex; gap: 8px; justify-content: flex-end; align-items: center; position: sticky; bottom: -24px; margin: auto -24px -24px; padding: 16px 24px; border-top: 1px solid var(--border-1); background: var(--bg-2); }
  /* .noti 페이지(고객센터·파트너·정산)의 자체 중앙팝업 모달 → 우측 슬라이드 패널로 통일 */
  .noti.rpanel { align-items: stretch !important; justify-content: flex-end !important; padding: 0 !important; }
  .noti.rpanel > * { width: 100% !important; height: 100vh !important; max-height: 100vh !important; border-radius: 0 !important; box-shadow: -8px 0 30px rgba(0,0,0,.12) !important; animation: slidePanelIn .3s ease; }
  .noti.rpanel > * > div { flex-shrink: 0; }
  .noti.rpanel > * > div[style*="overflow"] { flex: 1 1 auto; min-height: 0; }

  .detail-section { margin-bottom: 20px; }
  .detail-section h4 { font-size: 13px; font-weight: 700; color: var(--primary); margin-bottom: 9px; padding-bottom: 7px; border-bottom: 1px solid var(--border-1); }
  .detail-row { display: flex; flex-direction: column; gap: 4px; padding: 6px 0; }
  .detail-row .k { font-size: 12px; font-weight: 600; color: var(--text-3); }
  .detail-row .v { font-size: 15px; font-weight: 600; color: var(--text-1); line-height: 1.6; }

  .toast-wrap { position: fixed; bottom: 24px; left: 50%; transform: translateX(-50%); z-index: 300; display: flex; flex-direction: column; gap: 8px; }
  .toast { background: var(--text-1); color: #fff; padding: 12px 20px; border-radius: 10px; font-size: 14px; box-shadow: 0 6px 20px rgba(0,0,0,.18); max-width: 560px; }

  .section-title { font-size: 17px; font-weight: 800; margin-bottom: 14px; }
  .checkbox-row { display: flex; align-items: center; gap: 8px; font-size: 14px; color: var(--text-1); }
  .data-banner { display: flex; align-items: center; gap: 8px; padding: 9px 13px; border-radius: 10px; font-size: 13px; margin-bottom: 14px; }
  .data-banner.demo { background: var(--orange-bg); color: var(--orange); }
  .data-banner.loading { background: var(--bg-2); color: var(--text-2); }
  .filt { border: 1px solid var(--border-1); border-radius: 10px; overflow: hidden; margin-bottom: 14px; }
  .filt-row { display: flex; border-bottom: 1px solid var(--border-1); }

  .filt-row .c { flex: 1; padding: 9px 12px; display: flex; gap: 6px; align-items: center; flex-wrap: wrap; }
  .toggle { display: flex; align-items: center; justify-content: space-between; padding: 11px 14px; border: 1px solid var(--border-1); border-radius: 10px; margin-bottom: 8px; font-size: 14px; }
  .switch { width: 42px; height: 24px; border-radius: 99px; background: var(--border-2); position: relative; transition: background .15s; flex-shrink: 0; border: none; }
  .switch.on { background: var(--primary); }
  .switch::after { content: ""; position: absolute; top: 3px; left: 3px; width: 18px; height: 18px; border-radius: 99px; background: #fff; transition: left .15s; }
  .switch.on::after { left: 21px; }

  @media (max-width: 640px) {
    .apply-card { padding: 22px 18px; }
    .cat-grid { grid-template-columns: repeat(2, 1fr); }
    .steps { flex-direction: column; }
    .grid { grid-template-columns: 1fr !important; }
  }

  /* ===== 알림 관리 (Stitch 디자인 이식, 스코프 격리) ===== */
  /* 대시보드(.noti)는 별도 Stitch 팔레트였으나 전역 토큰으로 매핑하여 통일 */
  .noti { --np:var(--primary); --npc:var(--primary); --nbg:var(--bg-2); --nsl:var(--bg-1); --nslow:var(--bg-2); --nsc:var(--primary-bg); --nsch:var(--bg-2); --nschi:var(--border-1); --nos:var(--text-1); --nosv:var(--text-2); --nol:var(--text-3); --nolv:var(--border-1); --ninv:var(--text-1); --nsec:var(--green); --nsecc:var(--green-bg); --nerr:var(--red); --nter:var(--orange); font-family:"Pretendard Variable",Pretendard,-apple-system,sans-serif; color:var(--nos); }

  .msym.fill { font-variation-settings:'FILL' 1,'wght' 400,'GRAD' 0,'opsz' 24; }
  .noti .nhl { font-size:24px; line-height:32px; letter-spacing:-.02em; font-weight:700; }
  .noti .nhm { font-size:20px; line-height:28px; font-weight:600; }

  .noti .nls { font-size:12px; line-height:16px; font-weight:600; }
  .noti .nlm { font-size:13px; line-height:18px; font-weight:500; }
  .noti .nbm { font-size:14px; line-height:20px; }
  .noti .nmono { font-family:'JetBrains Mono',monospace; font-size:12px; }
  .noti .nmut { color:var(--nosv); }
  .ncard { background:var(--nsl); border:1px solid var(--nolv); border-radius:12px; }
  .ninput { width:100%; padding:11px 14px; background:#fff; border:1px solid var(--nolv); border-radius:8px; font-size:14px; outline:none; color:var(--nos); font-family:inherit; }
  .ninput:focus { border-color:var(--np); box-shadow:0 0 0 3px rgba(0,78,203,.12); }
  select.ninput { appearance:none; cursor:pointer; background-image:none; }
  .nbtn { border:none; border-radius:8px; font-weight:600; cursor:pointer; font-size:13px; font-family:inherit; transition:all .15s; }
  .nbtn:disabled { opacity:.5; cursor:not-allowed; }
  .nbtn-p { background:var(--np); color:#fff; }
  .nbtn-p:hover:not(:disabled) { filter:brightness(1.1); }
  .nbtn-g { background:var(--nsch); color:var(--nos); }
  .nbtn-g:hover { background:var(--nschi); }
  .nbtn-o { background:#fff; border:1px solid var(--nolv); color:var(--nos); }
  .nbtn-o:hover { background:var(--nslow); }
  .ntab { flex:1; padding:15px; display:flex; align-items:center; justify-content:center; gap:8px; font-size:13px; font-weight:500; border:none; background:transparent; cursor:pointer; color:var(--nosv); border-bottom:2px solid transparent; transition:all .15s; }
  .ntab.on { color:var(--np); background:#fff; border-bottom-color:var(--np); }
  .ntog { position:relative; width:36px; height:20px; border-radius:99px; background:var(--nolv); border:none; cursor:pointer; flex-shrink:0; transition:background .15s; }
  .ntog.on { background:var(--np); }
  .ntog::after { content:""; position:absolute; top:2px; left:2px; width:16px; height:16px; border-radius:99px; background:#fff; transition:left .15s; }
  .ntog.on::after { left:18px; }
  .nrow:hover { background:var(--nslow); }

  .ndrop:hover { background:var(--nslow); border-color:var(--np); }

function reducer(state, a) {
  switch (a.type) {
    case "PARTNER_STATUS": return { ...state, partners: state.partners.map((p) => p.id === a.id ? { ...p, status: a.status, statusLog: [{ action: a.status + " 처리", reason: a.reason || "", admin: a.admin || "master", date: nowStr() }, ...(p.statusLog || [])] } : p) };
    case "PARTNER_FEE": return { ...state, partners: state.partners.map((p) => p.id === a.id ? { ...p, feeRate: a.rate } : p) };
    case "PARTNER_RESERVE": return { ...state, partners: state.partners.map((p) => p.id === a.id ? { ...p, isReserve: a.value } : p) };
    case "ADD_PARTNER_ACCOUNT": return { ...state, partnerAccounts: [{ ...a.account, id: uid(), createdAt: TODAY }, ...state.partnerAccounts] };
    case "LINK_PARTNER_FACILITY": return { ...state, partnerAccounts: state.partnerAccounts.map((acc) => acc.id === a.accountId ? { ...acc, facilityIds: acc.facilityIds.includes(a.facilityId) ? acc.facilityIds : [...acc.facilityIds, a.facilityId] } : acc) };
    case "ADD_PARTNER": return { ...state, partners: [{ id: a.item.id || uid(), facility: a.item.facility, category: a.item.category, region: a.item.region, manager: a.item.manager, phone: a.item.phone, email: a.item.email, joinedAt: TODAY, status: "운영중", isReserve: false, revenue: 0, bookings: 0, feeRate: FEE_RATE, bizNo: a.item.bizNo || "", bizType: a.item.bizType || "", bizItem: a.item.bizItem || "", bankName: "", bankAccount: "", bankHolder: "" }, ...state.partners] };
    case "UPDATE_PARTNER": return { ...state, partners: state.partners.map((p) => p.id === a.id ? { ...p, ...a.patch } : p) };
    case "INQUIRY_DECISION": return { ...state, inquiryDecisions: { ...state.inquiryDecisions, [a.id]: { status: a.status, reason: a.reason || "" } } };
    case "CLAIM_STATUS": return { ...state, claims: state.claims.map((c) => c.id === a.id ? { ...c, status: a.status } : c) };
    case "CLAIM_ASSIGN": return { ...state, claims: state.claims.map((c) => c.id === a.id ? { ...c, assignee: a.assignee, status: c.status === "접수" ? "조사중" : c.status } : c) };
    case "CLAIM_RESOLVE": return { ...state, claims: state.claims.map((c) => c.id === a.id ? { ...c, status: "해결", resolution: a.resolution, resolvedAt: nowStr() } : c) };
    case "ADD_CODE": return { ...state, commonCodeGroups: state.commonCodeGroups.map((g) => g.key === a.groupKey ? { ...g, codes: [...g.codes, { code: a.code, label: a.label, active: true }] } : g) };
    case "UPDATE_CODE": return { ...state, commonCodeGroups: state.commonCodeGroups.map((g) => g.key === a.groupKey ? { ...g, codes: g.codes.map((c) => c.code === a.code ? { ...c, ...a.patch } : c) } : g) };
    case "TOGGLE_CODE": return { ...state, commonCodeGroups: state.commonCodeGroups.map((g) => g.key === a.groupKey ? { ...g, codes: g.codes.map((c) => c.code === a.code ? { ...c, active: !c.active } : c) } : g) };
    case "REVIEW_STATUS": return { ...state, reviews: state.reviews.map((r) => r.id === a.id ? { ...r, status: a.status } : r) };
    case "SET_REVIEW_REPLY": return { ...state, reviews: state.reviews.map((r) => r.id === a.id ? { ...r, reply: { content: a.content, date: nowStr(), author: a.author || r.facility } } : r) };
    case "DELETE_REVIEW_REPLY": return { ...state, reviews: state.reviews.map((r) => r.id === a.id ? { ...r, reply: null } : r) };
    case "MEMBER_STATUS": return { ...state, members: state.members.map((m) => m.id === a.id ? { ...m, status: a.status } : m) };
    case "MEMBER_VERIFY": return { ...state, members: state.members.map((m) => m.id === a.id ? { ...m, verified: true } : m) };
    case "GRANT_CREDIT": { const ids = new Set(a.memberIds); const logs = state.members.filter((m) => ids.has(m.id)).map((m) => ({ id: uid(), date: nowStr(), memberId: m.id, member: m.name, plan: m.planName, type: "지급", amount: a.amount, reason: a.reason, expiry: a.expiry, admin: a.admin || "master", returned: false })); return { ...state, members: state.members.map((m) => ids.has(m.id) ? { ...m, credits: m.credits + a.amount } : m), creditLogs: [...logs, ...state.creditLogs] }; }
    case "DEDUCT_CREDIT": { const m = state.members.find((x) => x.id === a.memberId); const log = { id: uid(), date: nowStr(), memberId: a.memberId, member: m ? m.name : "", plan: m ? m.planName : "-", type: "차감", amount: -a.amount, reason: a.reason || "관리자 차감", expiry: "-", admin: "master", returned: false }; return { ...state, members: state.members.map((x) => x.id === a.memberId ? { ...x, credits: Math.max(0, x.credits - a.amount) } : x), creditLogs: [log, ...state.creditLogs] }; }
    case "RETURN_CREDIT": { const log = state.creditLogs.find((l) => l.id === a.id); if (!log) return state; const rev = { id: uid(), date: nowStr(), memberId: log.memberId, member: log.member, plan: log.plan, type: "반환", amount: -log.amount, reason: "지급 취소(반환)", expiry: "-", admin: "master", returned: false }; return { ...state, members: state.members.map((m) => m.id === log.memberId ? { ...m, credits: m.credits - log.amount } : m), creditLogs: [rev, ...state.creditLogs.map((l) => l.id === a.id ? { ...l, returned: true } : l)] }; }
    case "ADD_COUPON": return { ...state, coupons: [{ ...a.coupon, id: uid(), issued: 0, used: 0, status: "진행중" }, ...state.coupons] };
    case "COUPON_STATUS": return { ...state, coupons: state.coupons.map((c) => c.id === a.id ? { ...c, status: a.status } : c) };
    case "UPDATE_COUPON": return { ...state, coupons: state.coupons.map((c) => c.id === a.id ? { ...c, ...a.patch } : c) };
    case "ADD_PROMOTION": return { ...state, promotions: [{ ...a.item, id: uid() }, ...state.promotions] };
    case "DELETE_PROMOTION": return { ...state, promotions: state.promotions.filter((p) => p.id !== a.id) };
    case "PROMO_PARTNER_STATUS": return { ...state, promotions: state.promotions.map((p) => p.id === a.promoId ? { ...p, partners: p.partners.map((pp) => a.partnerIds.includes(pp.id) ? { ...pp, status: a.status } : pp) } : p) };
    case "UPDATE_PROMOTION": return { ...state, promotions: state.promotions.map((p) => p.id === a.id ? { ...p, ...a.patch } : p) };
    case "SETTLE_STATUS": return { ...state, settlements: state.settlements.map((s) => s.id === a.id ? { ...s, status: a.status, holdReason: a.holdReason || "" } : s) };
    case "ADD_SETTLEMENTS": return { ...state, settlements: [...a.rows, ...state.settlements] };
    case "CANCEL_BOOKING": {
      const bk = state.bookings.find((b) => b.id === a.id);
      if (!bk || bk.status === "취소") return { ...state, bookings: state.bookings.map((b) => b.id === a.id ? { ...b, status: "취소" } : b) };
      const member = state.members.find((m) => m.name === bk.member);
      const log = { id: uid(), date: nowStr(), memberId: member ? member.id : null, member: bk.member, plan: member ? member.planName : "-", type: "반환", amount: bk.credits, reason: CR_REASONS["반환"] + " (" + bk.resNo + ")", expiry: member ? member.creditExpiry : "-", admin: "master", returned: false };
      return {
        ...state,
        bookings: state.bookings.map((b) => b.id === a.id ? { ...b, status: "취소" } : b),
        members: member ? state.members.map((m) => m.id === member.id ? { ...m, credits: m.credits + bk.credits } : m) : state.members,
        creditLogs: [log, ...state.creditLogs],
      };
    }
    case "CLASS_REVIEW_STATUS": return { ...state, classes: state.classes.map((c) => c.id === a.id ? { ...c, reviewStatus: a.reviewStatus, ...(a.note !== undefined ? { reviewNote: a.note } : {}) } : c) };
    case "SEND_MESSAGE": return { ...state, messages: [{ ...a.item, id: uid(), sentAt: nowStr(), readCount: 0 }, ...state.messages] };
    case "UPDATE_AUTO_MSG": return { ...state, autoMessages: state.autoMessages.map((m) => m.key === a.key ? { ...m, content: a.content } : m) };
    case "TOGGLE_AUTO_MSG": return { ...state, autoMessages: state.autoMessages.map((m) => m.key === a.key ? { ...m, on: !m.on } : m) };
    case "ADD_AUTO_MSG": return { ...state, autoMessages: [...state.autoMessages, { key: "custom" + uid(), label: a.label, content: a.content, group: a.group, on: true }] };
    case "TOGGLE_PUSH_TRIGGER": return { ...state, pushTriggers: state.pushTriggers.map((t) => t.id === a.id ? { ...t, on: !t.on } : t) };
    case "ADD_PUSH_TRIGGER": return { ...state, pushTriggers: [...state.pushTriggers, { ...a.item, id: uid(), on: true }] };
    case "UPDATE_PUSH_TRIGGER": return { ...state, pushTriggers: state.pushTriggers.map((t) => t.id === a.id ? { ...t, ...a.patch } : t) };
    case "SEND_PUSH_CAMPAIGN": return { ...state, pushCampaigns: [{ ...a.item, id: uid() }, ...state.pushCampaigns] };
    case "ADD_BANNER": return { ...state, banners: [{ ...a.item, id: uid(), createdAt: TODAY }, ...state.banners] };
    case "UPDATE_BANNER": return { ...state, banners: state.banners.map((b) => b.id === a.id ? { ...b, ...a.patch } : b) };
    case "DELETE_BANNER": return { ...state, banners: state.banners.filter((b) => b.id !== a.id) };
    case "ADD_MODAL": return { ...state, appModals: [{ ...a.item, id: uid() }, ...state.appModals] };
    case "UPDATE_MODAL": return { ...state, appModals: state.appModals.map((m) => m.id === a.item.id ? a.item : m) };
    case "DELETE_MODAL": return { ...state, appModals: state.appModals.filter((m) => m.id !== a.id) };
    case "TOGGLE_EXPIRE_PUSH": return { ...state, expirePush: { ...state.expirePush, [a.key]: !state.expirePush[a.key] } };
    case "SET_EXPIRE_ENABLED": return { ...state, expireEnabled: a.value };
    case "UPDATE_EXPIRE_POLICY": return { ...state, expirePolicies: state.expirePolicies.map((p) => p.key === a.key ? { ...p, ...a.patch } : p) };
    case "ADD_ADMIN": return { ...state, adminAccounts: [...state.adminAccounts, { ...a.account, createdAt: TODAY }] };
    case "DELETE_ADMIN": return { ...state, adminAccounts: state.adminAccounts.filter((x) => x.id !== a.id) };
    case "ADMIN_RESET_PW": return { ...state, adminAccounts: state.adminAccounts.map((x) => x.id === a.id ? { ...x, pw: a.pw } : x) };
    case "UPDATE_ADMIN": return { ...state, adminAccounts: state.adminAccounts.map((x) => x.id === a.id ? { ...x, ...a.patch } : x) };
    default: return state;
  }
}

function PageHead({ title, desc }) { return <div><div className="page-title">{title}</div>{desc && <div className="page-desc">{desc}</div>}</div>; }
function useEscClose(onClose) { useEffect(() => { const h = (e) => { if (e.key === "Escape") onClose(); }; document.addEventListener("keydown", h); return () => document.removeEventListener("keydown", h); }, [onClose]); }
function Modal({ title, onClose, children, lg, xl, fixed }) { useEscClose(onClose); return <div className="modal-overlay" onClick={onClose}><div className={"modal" + (lg ? " lg" : "") + (xl ? " xl" : "") + (fixed ? " fixed" : "")} onClick={(e) => e.stopPropagation()}><div className="modal-head"><h3>{title}</h3><button className="modal-close" onClick={onClose} aria-label="닫기"><span className="msym">close</span></button></div><div className="modal-body">{children}</div></div></div>; }
function ConfirmModal({ title, message, danger, confirmText, onConfirm, onClose }) { return <Modal title={title} onClose={onClose}><div style={{ lineHeight: 1.8, color: "var(--text-2)" }}>{message}</div><div className="modal-actions"><button className="btn btn-outline" onClick={onClose}>취소</button><button className={"btn " + (danger ? "btn-danger" : "btn-primary")} onClick={onConfirm}>{confirmText || "확인"}</button></div></Modal>; }
function DetailRow({ k, v }) { return <div className="detail-row"><div className="k">{k}</div><div className="v">{v == null || v === "" ? "-" : v}</div></div>; }
function DataBanner({ status, error, table }) { if (status === "loading") return <div className="data-banner loading">⏳ <b className="mono">{table}</b> 불러오는 중…</div>; if (status === "live") return null; return <div className="data-banner demo">▲ Supabase 연결 실패(<span className="mono">{error}</span>) — 더미 데이터 표시 중.</div>; }
function Pagination({ page, totalPages, onChange }) { const nums = []; const s = Math.max(1, page - 2), e = Math.min(totalPages, page + 2); for (let i = s; i <= e; i++) nums.push(i); return <div className="pager"><button disabled={page === 1} onClick={() => onChange(1)}>«</button><button disabled={page === 1} onClick={() => onChange(page - 1)}>‹</button>{nums.map((n) => <button key={n} className={n === page ? "active" : ""} onClick={() => onChange(n)}>{n}</button>)}<button disabled={page === totalPages} onClick={() => onChange(page + 1)}>›</button><button disabled={page === totalPages} onClick={() => onChange(totalPages)}>»</button></div>; }
function DataTable({ columns, rows, search, searchPlaceholder, toolbar, onRowClick, csvName, loading, pageSize = 20, emptyText = "데이터가 없습니다.", banner, initialQuery }) {
  const [q, setQ] = useState(() => initialQuery || ""); const [page, setPage] = useState(1);
  const filtered = useMemo(() => { if (!q || !search) return rows; const needle = q.toLowerCase(); return rows.filter((r) => search(r).some((v) => String(v == null ? "" : v).toLowerCase().includes(needle))); }, [rows, q, search]);
  useEffect(() => { setPage(1); }, [q, rows.length]);
  const totalPages = Math.max(1, Math.ceil(filtered.length / pageSize)); const cur = Math.min(page, totalPages); const pageRows = filtered.slice((cur - 1) * pageSize, cur * pageSize);
  const cellVal = (c, r) => (typeof c.key === "function" ? c.key(r) : r[c.key]);
  const exportCSV = () => downloadCSV(csvName || "export.csv", columns.filter((c) => !c.noCsv).map((c) => c.label), filtered.map((r) => columns.filter((c) => !c.noCsv).map((c) => (c.csv ? c.csv(r) : cellVal(c, r)))));
  return <div>{banner}
    <div className="toolbar">{search && <input className="input" placeholder={searchPlaceholder || "검색"} value={q} onChange={(e) => setQ(e.target.value)} />}{toolbar}<div className="spacer" /><span className="muted">총 {fmt(filtered.length)}건</span><button className="btn btn-outline btn-sm" onClick={exportCSV} disabled={!filtered.length}>CSV 다운로드</button></div>
    <div className="card p-tight"><div className="table-wrap"><table>
      <thead><tr>{columns.map((c, i) => <th key={i} style={c.align ? { textAlign: c.align } : null}>{c.label}</th>)}</tr></thead>
      <tbody>{loading ? <tr><td colSpan={columns.length} className="empty">불러오는 중…</td></tr> : pageRows.length === 0 ? <tr><td colSpan={columns.length} className="empty">{emptyText}</td></tr> : pageRows.map((r, ri) => <tr key={ri} className={onRowClick ? "clickable" : ""} style={onRowClick ? { cursor: "pointer" } : null} onClick={onRowClick ? () => onRowClick(r) : undefined}>{columns.map((c, ci) => <td key={ci} style={c.align ? { textAlign: c.align } : null}>{c.render ? c.render(r) : cellVal(c, r)}</td>)}</tr>)}</tbody>
    </table></div>{totalPages > 1 && <Pagination page={cur} totalPages={totalPages} onChange={setPage} />}</div>
  </div>;
}

  const pages = Math.max(1, Math.ceil(sorted.length / PER));
  const cur = Math.min(pg, pages);
  const rows = sorted.slice((cur - 1) * PER, cur * PER);

  const remove = (id) => { setList((l) => l.filter((f) => f.id !== id)); toast && toast("FAQ를 삭제했습니다."); };
  const doSearch = () => { setQuery(q); setPg(1); };
  const iconBtn = { padding: 6, borderRadius: 8, border: "none", background: "none", color: "var(--nosv)", cursor: canEdit ? "pointer" : "not-allowed", opacity: canEdit ? 1 : .4, display: "inline-flex" };
  const pageBtn = (on, dis) => ({ minWidth: 32, height: 32, borderRadius: 8, border: on ? "none" : "1px solid var(--nolv)", background: on ? "var(--np)" : "#fff", color: on ? "#fff" : "var(--nos)", fontWeight: 600, fontSize: 13, cursor: dis ? "not-allowed" : "pointer", opacity: dis ? .4 : 1, display: "inline-flex", alignItems: "center", justifyContent: "center" });

  return <div className="noti"><div style={{ display: "flex", flexDirection: "column", gap: 20 }}>
    <div style={{ display: "flex", justifyContent: "space-between", alignItems: "flex-end", flexWrap: "wrap", gap: 12 }}>
      <div><h3 className="page-title">FAQ</h3><p className="nbm nmut" style={{ marginTop: 4 }}>자주 묻는 질문을 카테고리별로 등록하고 관리합니다.</p></div>
      {canEdit && <button className="nbtn nbtn-p" style={{ display: "inline-flex", alignItems: "center", gap: 6, padding: "10px 16px" }} onClick={() => setReg(true)}><span className="msym" style={{ fontSize: 18 }}>add</span>신규 등록</button>}
    </div>

    <div className="ncard" style={{ overflow: "hidden" }}>
      <div style={{ padding: 20 }}>
        <div style={{ display: "flex", flexWrap: "wrap", alignItems: "center", gap: 12, marginBottom: 18 }}>
          <div className="nbm nmut">총 <span style={{ color: "var(--np)", fontWeight: 700 }}>{fmt(filtered.length)}</span>건</div>
          <div style={{ display: "flex", alignItems: "center", gap: 8, flex: 1, justifyContent: "flex-end", flexWrap: "wrap" }}>
            <div style={{ position: "relative" }}>
              <select className="ninput" style={{ width: "auto", padding: "9px 32px 9px 12px" }} value={cat} onChange={(e) => { setCat(e.target.value); setPg(1); }}>
                <option value="전체">전체 카테고리</option>{FAQ_CATS.map((c) => <option key={c} value={c}>{c}</option>)}
              </select>
              <span className="msym" style={{ position: "absolute", right: 8, top: "50%", transform: "translateY(-50%)", color: "var(--nol)", fontSize: 18, pointerEvents: "none" }}>expand_more</span>
            </div>
            <div style={{ position: "relative", flex: "0 1 280px" }}>
              <span className="msym" style={{ position: "absolute", left: 12, top: "50%", transform: "translateY(-50%)", color: "var(--nol)", fontSize: 18 }}>search</span>
              <input className="ninput" style={{ paddingLeft: 38 }} placeholder="질문 또는 키워드 검색" value={q} onChange={(e) => setQ(e.target.value)} onKeyDown={(e) => e.key === "Enter" && doSearch()} />
            </div>
            <button className="nbtn nbtn-p" style={{ display: "inline-flex", alignItems: "center", gap: 4, padding: "9px 14px" }} onClick={doSearch}><span className="msym" style={{ fontSize: 18 }}>search</span>검색</button>
          </div>
        </div>

        <div style={{ overflowX: "auto" }}>
          <table style={{ width: "100%", borderCollapse: "collapse" }}>
            <thead><tr style={{ background: "var(--nslow)", borderTop: "1px solid var(--nolv)", borderBottom: "1px solid var(--nolv)" }}>
              {[["번호", 60], ["카테고리", 110], ["질문", null], ["작성일", 130], ["관리", 110]].map(([h, w]) => <th key={h} className="nls nmut" style={{ textAlign: h === "관리" ? "center" : "left", padding: "12px 16px", width: w || "auto", whiteSpace: "nowrap" }}>{h}</th>)}
            </tr></thead>
            <tbody>
              {rows.length === 0 ? <tr><td colSpan="5" style={{ padding: 40, textAlign: "center", color: "var(--nol)" }}>등록된 FAQ가 없습니다.</td></tr> : rows.map((f) => <tr key={f.id} style={{ borderBottom: "1px solid var(--nolv)" }}>
                <td style={{ padding: "14px 16px", color: "var(--nol)" }}>{f.id}</td>
                <td style={{ padding: "14px 16px" }}><span style={{ padding: "2px 10px", borderRadius: 99, fontSize: 11, fontWeight: 700, background: "var(--nsch)", color: "var(--nosv)" }}>{f.category}</span></td>
                <td style={{ padding: "14px 16px" }}><div style={{ display: "flex", alignItems: "center", gap: 8 }}>{f.pinned && <span className="msym" style={{ fontSize: 16, color: "var(--np)" }}>push_pin</span>}<span style={{ fontWeight: 600 }}>{f.q}</span>{f.status === "임시저장" && <span style={{ padding: "1px 8px", borderRadius: 99, fontSize: 11, fontWeight: 700, background: "var(--orange-bg)", color: "var(--orange)" }}>임시저장</span>}</div></td>
                <td className="nmono" style={{ padding: "14px 16px", color: "var(--nol)" }}>{f.date}</td>
                <td style={{ padding: "14px 16px" }}><div style={{ display: "flex", justifyContent: "center", gap: 4 }}><button style={iconBtn} title="수정" onClick={() => canEdit && setReg(f)}><span className="msym" style={{ fontSize: 18 }}>edit</span></button><button style={iconBtn} title="삭제" onClick={() => canEdit && remove(f.id)}><span className="msym" style={{ fontSize: 18 }}>delete</span></button></div></td>
              </tr>)}
            </tbody>
          </table>
        </div>

        {pages > 1 && <div style={{ marginTop: 24, display: "flex", justifyContent: "center", alignItems: "center", gap: 4 }}>

          <button style={pageBtn(false, cur === pages)} onClick={() => cur < pages && setPg(cur + 1)}><span className="msym" style={{ fontSize: 18 }}>chevron_right</span></button>
        </div>}
      </div>
    </div>

function FaqRegisterModal({ onClose, onSubmit, initial }) {
  const [category, setCategory] = useState(initial ? initial.category : FAQ_CATS[0]);
  const [q, setQ] = useState(initial ? initial.q : "");
  const [a, setA] = useState(initial ? initial.a || "" : "");
  const [status, setStatus] = useState(initial ? initial.status : "임시저장");
  const [pinned, setPinned] = useState(initial ? initial.pinned : false);
  const [immediate, setImmediate] = useState(true);
  useEffect(() => { document.body.style.overflow = "hidden"; return () => { document.body.style.overflow = ""; }; }, []);

  const radio = (name, val, set, cur, label) => <label style={{ display: "inline-flex", alignItems: "center", gap: 6, cursor: "pointer", marginRight: 18 }}><input type="radio" name={name} checked={cur === val} onChange={() => set(val)} /><span className="nbm">{label}</span></label>;
  const submit = () => { if (!q.trim()) return; onSubmit({ category, q: q.trim(), a, status, pinned }); };

  return <div className="noti rpanel" style={{ position: "fixed", inset: 0, zIndex: 60, display: "flex", alignItems: "center", justifyContent: "center", padding: 24, background: "rgba(0,0,0,.4)", backdropFilter: "blur(4px)" }} onClick={onClose}>

        <h4 className="nhs">{initial ? "FAQ 수정" : "FAQ 등록"}</h4>
        <button onClick={onClose} style={{ border: "none", background: "none", cursor: "pointer", display: "inline-flex", color: "var(--nosv)" }}><span className="msym">close</span></button>
      </div>
      <div style={{ padding: 20, overflowY: "auto", display: "flex", flexDirection: "column", gap: 16 }}>
        <div><label className="nlm" style={{ display: "block", marginBottom: 6 }}>카테고리</label><div style={{ position: "relative" }}><select className="ninput" style={{ padding: "11px 32px 11px 12px" }} value={category} onChange={(e) => setCategory(e.target.value)}>{FAQ_CATS.map((c) => <option key={c} value={c}>{c}</option>)}</select><span className="msym" style={{ position: "absolute", right: 8, top: "50%", transform: "translateY(-50%)", color: "var(--nol)", fontSize: 18, pointerEvents: "none" }}>expand_more</span></div></div>
        <div><label className="nlm" style={{ display: "block", marginBottom: 6 }}>질문</label><input className="ninput" placeholder="질문 내용을 입력하세요" value={q} onChange={(e) => setQ(e.target.value)} /></div>
        <div><label className="nlm" style={{ display: "block", marginBottom: 6 }}>답변</label><textarea className="ninput" style={{ minHeight: 120, resize: "vertical", lineHeight: 1.5 }} placeholder="답변 내용을 입력하세요..." value={a} onChange={(e) => setA(e.target.value)} /></div>
        <div><label className="nlm" style={{ display: "block", marginBottom: 6 }}>첨부파일</label><div style={{ border: "2px dashed var(--nolv)", borderRadius: 8, padding: 20, display: "flex", flexDirection: "column", alignItems: "center", gap: 6, background: "var(--nslow)", color: "var(--nosv)" }}><span className="msym" style={{ fontSize: 24, color: "var(--nol)" }}>cloud_upload</span><span className="nbm">파일 업로드 <span style={{ color: "var(--nol)", fontSize: 12 }}>(최대 20MB)</span></span></div></div>
        <div style={{ display: "grid", gridTemplateColumns: "1fr 1fr", gap: 16 }}>
          <div><label className="nlm" style={{ display: "block", marginBottom: 6 }}>게시 상태</label>{radio("s", "임시저장", setStatus, status, "임시저장")}{radio("s", "게시", setStatus, status, "게시")}</div>
          <div><label className="nlm" style={{ display: "block", marginBottom: 6 }}>상단 고정</label><div style={{ display: "flex", alignItems: "center", gap: 10 }}><span className="nbm nmut">OFF</span><button onClick={() => setPinned((p) => !p)} style={{ width: 40, height: 22, borderRadius: 99, border: "none", cursor: "pointer", background: pinned ? "var(--np)" : "var(--nschi)", position: "relative", transition: "all .15s" }}><span style={{ position: "absolute", top: 2, left: pinned ? 20 : 2, width: 18, height: 18, borderRadius: 99, background: "#fff", boxShadow: "0 1px 3px rgba(0,0,0,.25)", transition: "all .15s" }} /></button><span className="nbm nmut">ON</span></div></div>
        </div>
        <div><label className="nlm" style={{ display: "block", marginBottom: 6 }}>게시 시작일</label><div style={{ display: "flex", alignItems: "center", gap: 16, flexWrap: "wrap" }}><label style={{ display: "inline-flex", alignItems: "center", gap: 6, cursor: "pointer" }}><input type="radio" name="d" checked={immediate} onChange={() => setImmediate(true)} /><span className="nbm">즉시 게시</span></label><label style={{ display: "inline-flex", alignItems: "center", gap: 6, cursor: "pointer" }}><input type="radio" name="d" checked={!immediate} onChange={() => setImmediate(false)} /><span className="nbm">예약</span></label><input type="date" className="ninput" style={{ width: "auto", opacity: immediate ? .5 : 1 }} disabled={immediate} /></div></div>
      </div>
      <div style={{ padding: 20, background: "var(--nslow)", display: "flex", justifyContent: "flex-end", gap: 12 }}>

        <button className="nbtn nbtn-p" style={{ padding: "10px 20px" }} onClick={submit}>{initial ? "저장" : "등록 완료"}</button>
      </div>
    </div>
  </div>;
}

  const switchTab = (t) => { setTab(t); setCat("전체"); setStat("전체"); setQ(""); setQuery(""); setPg(1); setSel(null); };
  const filtered = list.filter((x) => qnaAuthorType(x) === tab && (cat === "전체" || x.category === cat) && (stat === "전체" || x.status === stat) && (!query || x.title.includes(query) || qnaAuthorLabel(x).includes(query)));
  const sorted = [...filtered].sort((a, b) => b.id - a.id);
  const PER = 8;
  const pages = Math.max(1, Math.ceil(sorted.length / PER));
  const cur = Math.min(pg, pages);
  const rows = sorted.slice((cur - 1) * PER, cur * PER);

  const doSearch = () => { setQuery(q); setPg(1); };

  const exportCsv = () => downloadCSV("qna_" + (tab === "파트너" ? "파트너" : "이용자") + "_문의내역", ["번호", "문의유형", "제목", authorCol, "작성일", "답변상태"], sorted.map((x) => [x.id, x.category, x.title, qnaAuthorLabel(x), x.date, x.status]));
  const save = (id, answer) => { setList((l) => l.map((x) => x.id === id ? { ...x, answer, status: "답변완료" } : x)); setSel(null); toast && toast("답변이 등록되었습니다."); };
  const statusBadge = (s) => { const on = s === "답변완료"; const bg = on ? "var(--green-bg)" : "var(--orange-bg)"; const fg = on ? "var(--green)" : "var(--orange)"; return <span style={{ display: "inline-flex", alignItems: "center", gap: 6, padding: "4px 10px", borderRadius: 99, fontSize: 11, fontWeight: 700, background: bg, color: fg }}><span style={{ width: 6, height: 6, borderRadius: 99, background: fg }} />{s}</span>; };
  const pageBtn = (on, dis) => ({ minWidth: 32, height: 32, borderRadius: 8, border: on ? "none" : "1px solid var(--nolv)", background: on ? "var(--np)" : "#fff", color: on ? "#fff" : "var(--nos)", fontWeight: 600, fontSize: 13, cursor: dis ? "not-allowed" : "pointer", opacity: dis ? .4 : 1, display: "inline-flex", alignItems: "center", justifyContent: "center" });
  const selWrap = (value, onChange, opts) => <div style={{ position: "relative" }}><select className="ninput" style={{ padding: "10px 32px 10px 12px" }} value={value} onChange={onChange}>{opts.map((o) => <option key={o} value={o}>{o}</option>)}</select><span className="msym" style={{ position: "absolute", right: 8, top: "50%", transform: "translateY(-50%)", color: "var(--nol)", fontSize: 18, pointerEvents: "none" }}>expand_more</span></div>;

  return <div className="noti"><div style={{ display: "flex", flexDirection: "column", gap: 20 }}>
    <div><h3 className="page-title">Q&amp;A</h3><p className="nbm nmut" style={{ marginTop: 4 }}>고객 및 파트너의 문의사항을 관리하고 답변을 등록합니다.</p></div>

    <div style={{ display: "flex", gap: 4, borderBottom: "1px solid var(--nolv)" }}>
      {[["이용자", "이용자 문의"], ["파트너", "파트너 문의"]].map(([k, l]) => <button key={k} className={"ntab" + (tab === k ? " on" : "")} style={{ flex: "0 0 auto", padding: "13px 22px" }} onClick={() => switchTab(k)}>{l}</button>)}
    </div>

    <div className="ncard" style={{ padding: 20 }}>
      <div style={{ display: "grid", gridTemplateColumns: "1fr 1fr 2fr", gap: 14, alignItems: "end" }}>
        <div><label className="nlm" style={{ display: "block", marginBottom: 6, color: "var(--nosv)" }}>문의유형</label>{selWrap(cat, (e) => { setCat(e.target.value); setPg(1); }, ["전체", ...catOpts])}</div>
        <div><label className="nlm" style={{ display: "block", marginBottom: 6, color: "var(--nosv)" }}>답변상태</label>{selWrap(stat, (e) => { setStat(e.target.value); setPg(1); }, ["전체", "답변대기", "답변완료"])}</div>
        <div style={{ display: "flex", gap: 10, alignItems: "flex-end" }}>
          <div style={{ flex: 1 }}><label className="nlm" style={{ display: "block", marginBottom: 6, color: "var(--nosv)" }}>검색어</label><input className="ninput" placeholder="제목 또는 작성자명을 입력하세요" value={q} onChange={(e) => setQ(e.target.value)} onKeyDown={(e) => e.key === "Enter" && doSearch()} /></div>
          <button className="nbtn nbtn-p" style={{ display: "inline-flex", alignItems: "center", gap: 6, padding: "11px 18px" }} onClick={doSearch}><span className="msym" style={{ fontSize: 18 }}>search</span>검색</button>
        </div>
      </div>
    </div>

    <div className="ncard" style={{ overflow: "hidden" }}>
      <div style={{ padding: "16px 20px", borderBottom: "1px solid var(--nolv)", display: "flex", justifyContent: "space-between", alignItems: "center", flexWrap: "wrap", gap: 10 }}>
        <div style={{ display: "flex", alignItems: "center", gap: 8 }}><span className="nbm" style={{ fontWeight: 700 }}>총 {fmt(filtered.length)}건</span><span style={{ color: "var(--nolv)" }}>|</span><span className="nbm nmut">답변대기 {fmt(filtered.filter((x) => x.status === "답변대기").length)}건</span></div>
        <button className="nbtn nbtn-o" style={{ display: "inline-flex", alignItems: "center", gap: 6, padding: "7px 12px", fontSize: 12 }} onClick={exportCsv}><span className="msym" style={{ fontSize: 18 }}>download</span>엑셀 다운로드</button>
      </div>
      <div style={{ overflowX: "auto" }}>
        <table style={{ width: "100%", borderCollapse: "collapse" }}>
          <thead><tr style={{ background: "var(--nslow)", borderBottom: "1px solid var(--nolv)" }}>
            {[["번호", 60], ["문의유형", 110], ["제목", null], [authorCol, tab === "파트너" ? 220 : 100], ["작성일", 120], ["답변상태", 110], ["관리", 120]].map(([h, w]) => <th key={h} className="nls nmut" style={{ textAlign: h === "관리" ? "center" : "left", padding: "12px 16px", width: w || "auto", whiteSpace: "nowrap" }}>{h}</th>)}
          </tr></thead>
          <tbody>
            {rows.length === 0 ? <tr><td colSpan="7" style={{ padding: 40, textAlign: "center", color: "var(--nol)" }}>문의 내역이 없습니다.</td></tr> : rows.map((x) => <tr key={x.id} style={{ borderBottom: "1px solid var(--nolv)" }}>
              <td style={{ padding: "14px 16px", color: "var(--nol)" }}>{x.id}</td>
              <td style={{ padding: "14px 16px" }}><span style={{ padding: "2px 9px", borderRadius: 5, fontSize: 11, fontWeight: 700, background: "var(--nsch)", color: "var(--nosv)" }}>{x.category}</span></td>
              <td style={{ padding: "14px 16px" }}><span onClick={() => setSel(x)} style={{ fontWeight: 700, cursor: "pointer" }} onMouseEnter={(e) => e.currentTarget.style.color = "var(--np)"} onMouseLeave={(e) => e.currentTarget.style.color = "var(--nos)"}>{x.title}</span></td>
              <td style={{ padding: "14px 16px", color: "var(--nosv)" }}>{tab === "파트너" ? <span><b style={{ color: "var(--nos)" }}>{x.facility || x.author}</b>{x.facilityCode && <span className="nmono" style={{ marginLeft: 6, color: "var(--nol)", fontSize: 11 }}>{x.facilityCode}</span>}</span> : x.author}</td>
              <td className="nmono" style={{ padding: "14px 16px", color: "var(--nol)" }}>{x.date}</td>
              <td style={{ padding: "14px 16px" }}>{statusBadge(x.status)}</td>
              <td style={{ padding: "14px 16px", textAlign: "center" }}>{x.status === "답변완료" ? <button onClick={() => setSel(x)} style={{ padding: "6px 14px", borderRadius: 8, border: "1px solid var(--np)", background: "#fff", color: "var(--np)", fontWeight: 700, fontSize: 12, cursor: "pointer" }}>답변 수정</button> : <button className="nbtn nbtn-p" style={{ padding: "6px 14px", fontSize: 12 }} onClick={() => setSel(x)}>답변 등록</button>}</td>
            </tr>)}
          </tbody>
        </table>
      </div>
      {pages > 1 && <div style={{ padding: "16px 20px", display: "flex", justifyContent: "center", alignItems: "center", gap: 4 }}>
        <button style={pageBtn(false, cur === 1)} onClick={() => cur > 1 && setPg(cur - 1)}><span className="msym" style={{ fontSize: 18 }}>chevron_left</span></button>
        {Array.from({ length: pages }, (_, i) => i + 1).map((p) => <button key={p} style={pageBtn(p === cur, false)} onClick={() => setPg(p)}>{p}</button>)}
        <button style={pageBtn(false, cur === pages)} onClick={() => cur < pages && setPg(cur + 1)}><span className="msym" style={{ fontSize: 18 }}>chevron_right</span></button>
      </div>}
    </div>

    {sel && <QnaAnswerModal item={sel} canEdit={canEdit} onClose={() => setSel(null)} onSave={(answer) => save(sel.id, answer)} />}
  </div></div>;
}

function QnaAnswerModal({ item, canEdit, onClose, onSave }) {

  useEffect(() => { document.body.style.overflow = "hidden"; return () => { document.body.style.overflow = ""; }; }, []);

  return <div className="noti rpanel" style={{ position: "fixed", inset: 0, zIndex: 60, display: "flex", alignItems: "center", justifyContent: "center", padding: 24, background: "rgba(0,0,0,.5)", backdropFilter: "blur(2px)" }} onClick={onClose}>

      </div>
      <div style={{ padding: 20, background: "var(--nslow)", display: "flex", justifyContent: "flex-end", gap: 12 }}>
        <button className="nbtn nbtn-o" style={{ padding: "10px 20px" }} onClick={onClose}>취소</button>
        <button className="nbtn nbtn-p" style={{ padding: "10px 20px" }} disabled={!canEdit || !answer.trim()} onClick={() => onSave(answer.trim())}>답변 완료</button>
      </div>
    </div>
  </div>;
}

/* ============================================================
   운영 알림 · 클레임 관리
============================================================ */
const claimStatusStyle = (s) => s === "접수" ? { bg: "var(--orange-bg)", fg: "var(--orange)" } : s === "조사중" ? { bg: "var(--primary-bg)", fg: "var(--np)" } : { bg: "var(--green-bg)", fg: "var(--green)" };
const claimBadge = (s) => { const c = claimStatusStyle(s); return <span style={{ display: "inline-flex", alignItems: "center", gap: 6, padding: "4px 10px", borderRadius: 99, fontSize: 11, fontWeight: 700, background: c.bg, color: c.fg }}><span style={{ width: 6, height: 6, borderRadius: 99, background: c.fg }} />{s}</span>; };

function ClaimsPage({ state, dispatch, toast, canEdit, currentUser }) {
  const [tab, setTab] = useState("전체"); const [cat, setCat] = useState(""); const [q, setQ] = useState(""); const [pg, setPg] = useState(1); const [sel, setSel] = useState(null);
  const filtered = state.claims.filter((c) => (tab === "전체" || c.status === tab) && (!cat || c.category === cat) && (!q || [c.member, c.facility, c.resNo].some((v) => String(v).includes(q))));
  const sorted = [...filtered].sort((a, b) => (a.status === "해결" ? 1 : 0) - (b.status === "해결" ? 1 : 0) || b.id - a.id);
  const PER = 8;
  const pages = Math.max(1, Math.ceil(sorted.length / PER));
  const cur = Math.min(pg, pages);
  const rows = sorted.slice((cur - 1) * PER, cur * PER);
  const pendingCount = state.claims.filter((c) => c.status !== "해결").length;
  const exportCsv = () => downloadCSV("claims_" + TODAY, ["접수일", "예약번호", "회원명", "파트너명", "유형", "담당자", "상태"], sorted.map((c) => [c.createdAt, c.resNo, c.member, c.facility, c.category, c.assignee || "-", c.status]));
  const pageBtn = (on, dis) => ({ minWidth: 32, height: 32, borderRadius: 8, border: on ? "none" : "1px solid var(--nolv)", background: on ? "var(--np)" : "#fff", color: on ? "#fff" : "var(--nos)", fontWeight: 600, fontSize: 13, cursor: dis ? "not-allowed" : "pointer", opacity: dis ? .4 : 1, display: "inline-flex", alignItems: "center", justifyContent: "center" });
  const selWrap = (value, onChange, opts, ph) => <div style={{ position: "relative" }}><select className="ninput" style={{ padding: "10px 32px 10px 12px" }} value={value} onChange={onChange}><option value="">{ph}</option>{opts.map((o) => <option key={o} value={o}>{o}</option>)}</select><span className="msym" style={{ position: "absolute", right: 8, top: "50%", transform: "translateY(-50%)", color: "var(--nol)", fontSize: 18, pointerEvents: "none" }}>expand_more</span></div>;

  const save = (patch) => {
    if (patch.resolution !== undefined) dispatch({ type: "CLAIM_RESOLVE", id: sel.id, resolution: patch.resolution });
    else if (patch.assignee !== undefined) dispatch({ type: "CLAIM_ASSIGN", id: sel.id, assignee: patch.assignee });
    else dispatch({ type: "CLAIM_STATUS", id: sel.id, status: patch.status });
    setSel(null); toast("클레임이 업데이트되었습니다.");
  };

  return <div className="noti"><div style={{ display: "flex", flexDirection: "column", gap: 20 }}>
    <div><h3 className="page-title">운영 알림 · 클레임 관리</h3><p className="nbm nmut" style={{ marginTop: 4 }}>회원·파트너 클레임을 접수부터 해결까지 추적합니다. 현재 <b style={{ color: "var(--orange)" }}>{pendingCount}건</b> 처리 대기 중입니다.</p></div>

    <div style={{ display: "flex", gap: 4, borderBottom: "1px solid var(--nolv)" }}>
      {["전체", "접수", "조사중", "해결"].map((t) => <button key={t} className={"ntab" + (tab === t ? " on" : "")} style={{ flex: "0 0 auto", padding: "13px 22px" }} onClick={() => { setTab(t); setPg(1); }}>{t}</button>)}
    </div>

    <div className="ncard" style={{ padding: 20 }}>
      <div style={{ display: "grid", gridTemplateColumns: "1fr 2fr", gap: 14, alignItems: "end" }}>
        <div><label className="nlm" style={{ display: "block", marginBottom: 6, color: "var(--nosv)" }}>유형</label>{selWrap(cat, (e) => { setCat(e.target.value); setPg(1); }, CLAIM_CATS, "전체 유형")}</div>
        <div style={{ display: "flex", gap: 10, alignItems: "flex-end" }}>
          <div style={{ flex: 1 }}><label className="nlm" style={{ display: "block", marginBottom: 6, color: "var(--nosv)" }}>검색어</label><input className="ninput" placeholder="회원명, 파트너명, 예약번호" value={q} onChange={(e) => { setQ(e.target.value); setPg(1); }} /></div>
          <button className="nbtn nbtn-o" style={{ display: "inline-flex", alignItems: "center", gap: 6, padding: "11px 18px" }} onClick={exportCsv}><span className="msym" style={{ fontSize: 18 }}>download</span>CSV</button>
        </div>
      </div>
    </div>

    <div className="ncard" style={{ overflow: "hidden" }}>
      <div style={{ overflowX: "auto" }}><table style={{ width: "100%", borderCollapse: "collapse" }}>
        <thead><tr style={{ background: "var(--nslow)", borderBottom: "1px solid var(--nolv)" }}>{["접수일", "예약번호", "회원명", "파트너명", "유형", "담당자", "상태", "관리"].map((h) => <th key={h} className="nlm nmut" style={{ textAlign: h === "관리" ? "center" : "left", padding: "14px 20px", whiteSpace: "nowrap" }}>{h}</th>)}</tr></thead>
        <tbody>{rows.length === 0 ? <tr><td colSpan="8" style={{ padding: 40, textAlign: "center", color: "var(--nol)" }}>클레임이 없습니다.</td></tr> : rows.map((c) => <tr key={c.id} style={{ borderBottom: "1px solid rgba(194,198,216,.4)" }}>
          <td className="nmono" style={{ padding: "14px 20px", color: "var(--nol)" }}>{c.createdAt}</td>
          <td className="nmono" style={{ padding: "14px 20px" }}>{c.resNo}</td>
          <td style={{ padding: "14px 20px", fontWeight: 600 }}>{c.member}</td>
          <td style={{ padding: "14px 20px", color: "var(--nosv)" }}>{c.facility}</td>
          <td style={{ padding: "14px 20px" }}>{c.category}</td>
          <td style={{ padding: "14px 20px", color: "var(--nosv)" }}>{c.assignee || "미배정"}</td>
          <td style={{ padding: "14px 20px" }}>{claimBadge(c.status)}</td>
          <td style={{ padding: "14px 20px", textAlign: "center" }}><button className="nbtn nbtn-o" style={{ padding: "6px 14px", fontSize: 12 }} onClick={() => setSel(c)}>상세보기</button></td>
        </tr>)}</tbody>
      </table></div>
      {pages > 1 && <div style={{ padding: "16px 0", display: "flex", justifyContent: "center", alignItems: "center", gap: 4 }}>
        <button style={pageBtn(false, cur === 1)} onClick={() => cur > 1 && setPg(cur - 1)}><span className="msym" style={{ fontSize: 18 }}>chevron_left</span></button>
        {Array.from({ length: pages }, (_, i) => i + 1).map((p) => <button key={p} style={pageBtn(p === cur, false)} onClick={() => setPg(p)}>{p}</button>)}
        <button style={pageBtn(false, cur === pages)} onClick={() => cur < pages && setPg(cur + 1)}><span className="msym" style={{ fontSize: 18 }}>chevron_right</span></button>
      </div>}
    </div>

    {sel && <ClaimDetailModal claim={sel} admins={state.adminAccounts} canEdit={canEdit} onClose={() => setSel(null)} onSave={save} />}
  </div></div>;
}

function ClaimDetailModal({ claim, admins, canEdit, onClose, onSave }) {
  const [assignee, setAssignee] = useState(claim.assignee || ""); const [resolution, setResolution] = useState(claim.resolution || "");

    <div className="ncard" style={{ width: "100%", maxWidth: 720, maxHeight: "88vh", display: "flex", flexDirection: "column", overflow: "hidden", boxShadow: "0 20px 50px rgba(0,0,0,.25)" }} onClick={(e) => e.stopPropagation()}>
      <div style={{ padding: 20, borderBottom: "1px solid var(--nolv)", display: "flex", justifyContent: "space-between", alignItems: "center" }}>
        <h4 className="nhs" style={{ display: "flex", alignItems: "center", gap: 10 }}>클레임 상세 {claimBadge(claim.status)}</h4>
        <button onClick={onClose} style={{ border: "none", background: "none", cursor: "pointer", display: "inline-flex", color: "var(--nosv)" }}><span className="msym">close</span></button>
      </div>

        <div style={{ display: "grid", gridTemplateColumns: "1fr 1fr", gap: 14 }}>{ro("예약번호", claim.resNo)}{ro("유형", claim.category)}{ro("회원명", claim.member)}{ro("파트너명", claim.facility)}{ro("접수일", claim.createdAt)}</div>
        <div><label className="nlm" style={{ display: "block", marginBottom: 6, color: "var(--nosv)" }}>클레임 내용</label><div style={{ padding: 14, borderRadius: 8, background: "var(--nslow)", border: "1px solid var(--nolv)", color: "var(--nosv)", fontSize: 14, lineHeight: 1.6, minHeight: 70, whiteSpace: "pre-wrap" }}>{claim.description}</div></div>
        {claim.status !== "해결" && <div><label className="nlm" style={{ display: "block", marginBottom: 6, color: "var(--nos)" }}>담당자 배정</label><div style={{ display: "flex", gap: 10 }}><select className="ninput" disabled={!canEdit} value={assignee} onChange={(e) => setAssignee(e.target.value)}><option value="">미배정</option>{admins.map((a) => <option key={a.id} value={a.id}>{a.name} ({a.id})</option>)}</select><button className="nbtn nbtn-o" style={{ padding: "10px 18px" }} disabled={!canEdit || !assignee || assignee === claim.assignee} onClick={() => onSave({ assignee })}>배정</button></div></div>}
        {claim.status === "해결" ? <div><label className="nlm" style={{ display: "block", marginBottom: 6, color: "var(--nos)" }}>처리 결과</label><div style={{ padding: 14, borderRadius: 8, background: "var(--green-bg)", border: "1px solid rgba(11,163,96,.2)", color: "var(--nos)", fontSize: 14, lineHeight: 1.6 }}>{claim.resolution}<div style={{ marginTop: 8, fontSize: 12, color: "var(--nol)" }}>해결일: {claim.resolvedAt}</div></div></div>
          : <div><label className="nlm" style={{ display: "block", marginBottom: 6, color: "var(--nos)" }}>해결 처리</label><textarea className="ninput" style={{ minHeight: 100, resize: "vertical", lineHeight: 1.5 }} disabled={!canEdit} placeholder="처리 결과를 입력하세요..." value={resolution} onChange={(e) => setResolution(e.target.value)} /></div>}
      </div>
      <div style={{ padding: 20, background: "var(--nslow)", display: "flex", justifyContent: "flex-end", gap: 12 }}>
        <button className="nbtn nbtn-o" style={{ padding: "10px 20px" }} onClick={onClose}>닫기</button>
        {claim.status === "접수" && <button className="nbtn nbtn-p" style={{ padding: "10px 20px" }} disabled={!canEdit} onClick={() => onSave({ status: "조사중" })}>조사 시작</button>}
        {claim.status !== "해결" && <button className="nbtn nbtn-p" style={{ padding: "10px 20px", background: "var(--nerr)" }} disabled={!canEdit || !resolution.trim()} onClick={() => onSave({ resolution: resolution.trim() })}>해결 완료</button>}
      </div>
    </div>
  </div>;
}

/* ============================================================
   리뷰 · 평점 관리
============================================================ */
const ratingStars = (n) => "★".repeat(Math.round(n)) + "☆".repeat(5 - Math.round(n));
const reviewPageBtn = (on, dis) => ({ minWidth: 32, height: 32, borderRadius: 8, border: on ? "none" : "1px solid var(--nolv)", background: on ? "var(--np)" : "#fff", color: on ? "#fff" : "var(--nos)", fontWeight: 600, fontSize: 13, cursor: dis ? "not-allowed" : "pointer", opacity: dis ? .4 : 1, display: "inline-flex", alignItems: "center", justifyContent: "center" });
const reviewPager = (cur, pages, setPg) => pages > 1 && <div style={{ padding: "16px 0", display: "flex", justifyContent: "center", alignItems: "center", gap: 4 }}>
  <button style={reviewPageBtn(false, cur === 1)} onClick={() => cur > 1 && setPg(cur - 1)}><span className="msym" style={{ fontSize: 18 }}>chevron_left</span></button>
  {Array.from({ length: pages }, (_, i) => i + 1).map((p) => <button key={p} style={reviewPageBtn(p === cur, false)} onClick={() => setPg(p)}>{p}</button>)}
  <button style={reviewPageBtn(false, cur === pages)} onClick={() => cur < pages && setPg(cur + 1)}><span className="msym" style={{ fontSize: 18 }}>chevron_right</span></button>
</div>;
const replyBadge = (r) => r.reply ? <span style={{ padding: "2px 10px", borderRadius: 99, fontSize: 11, fontWeight: 700, background: "var(--primary-bg)", color: "var(--np)" }}>답변완료</span> : <span style={{ padding: "2px 10px", borderRadius: 99, fontSize: 11, fontWeight: 700, background: "var(--orange-bg)", color: "var(--orange)" }}>미답변</span>;
const visBadge = (r) => r.status === "노출" ? <span style={{ padding: "2px 10px", borderRadius: 99, fontSize: 11, fontWeight: 700, background: "var(--green-bg)", color: "var(--green)" }}>노출</span> : <span style={{ padding: "2px 10px", borderRadius: 99, fontSize: 11, fontWeight: 700, background: "var(--nsch)", color: "var(--nosv)" }}>숨김</span>;

function ReviewDetailModal({ review, canEdit, onClose, onToggle, onSetReply, onDeleteReply }) {
  const [replyDraft, setReplyDraft] = useState(review.reply ? review.reply.content : "");
  const [editingReply, setEditingReply] = useState(!review.reply);

  return <div className="noti rpanel" style={{ position: "fixed", inset: 0, zIndex: 110, display: "flex", alignItems: "center", justifyContent: "center", padding: 24, background: "rgba(0,0,0,.5)", backdropFilter: "blur(2px)" }} onClick={onClose}>
    <div className="ncard" style={{ width: "100%", maxWidth: 720, maxHeight: "88vh", display: "flex", flexDirection: "column", overflow: "hidden", boxShadow: "0 20px 50px rgba(0,0,0,.25)" }} onClick={(e) => e.stopPropagation()}>
      <div style={{ padding: 20, borderBottom: "1px solid var(--nolv)", display: "flex", justifyContent: "space-between", alignItems: "center" }}>
        <h4 className="nhs" style={{ display: "flex", alignItems: "center", gap: 10 }}>리뷰 상세 {visBadge(review)}</h4>
        <button onClick={onClose} style={{ border: "none", background: "none", cursor: "pointer", display: "inline-flex", color: "var(--nosv)" }}><span className="msym">close</span></button>
      </div>
      <div style={{ padding: 20, overflowY: "auto", display: "flex", flexDirection: "column", gap: 16 }}>
        <div style={{ display: "grid", gridTemplateColumns: "1fr 1fr", gap: 14 }}>{ro("파트너명", review.facility)}{ro("작성자", review.member)}{ro("평점", ratingStars(review.rating) + "  (" + review.rating + "/5)")}{ro("작성일", review.date)}</div>
        {review.reportCount > 0 && <div style={{ padding: 10, borderRadius: 8, background: "var(--red-bg)", color: "var(--nerr)", fontSize: 12, fontWeight: 700 }}>신고 {review.reportCount}건 접수됨</div>}
        <div><label className="nlm" style={{ display: "block", marginBottom: 6, color: "var(--nosv)" }}>리뷰 내용</label><div style={{ padding: 14, borderRadius: 8, background: "var(--nslow)", border: "1px solid var(--nolv)", color: "var(--nos)", fontSize: 14, lineHeight: 1.6, whiteSpace: "pre-wrap" }}>{review.content}</div></div>

        <div style={{ borderTop: "1px solid var(--nolv)", paddingTop: 16 }}>
          <label className="nlm" style={{ display: "block", marginBottom: 8, color: "var(--nos)" }}>파트너 답글</label>
          {!editingReply && review.reply ? <div style={{ padding: 14, borderRadius: 8, background: "var(--primary-bg)", border: "1px solid rgba(0,78,203,.15)" }}>
            <div style={{ display: "flex", justifyContent: "space-between", marginBottom: 6 }}><span style={{ fontSize: 12, fontWeight: 700, color: "var(--np)" }}>{review.reply.author}</span><span className="nmono" style={{ fontSize: 11, color: "var(--nol)" }}>{review.reply.date}</span></div>
            <div style={{ fontSize: 14, color: "var(--nos)", lineHeight: 1.6, whiteSpace: "pre-wrap" }}>{review.reply.content}</div>
            {canEdit && <div style={{ display: "flex", gap: 8, marginTop: 10 }}><button className="nbtn nbtn-o" style={{ padding: "5px 12px", fontSize: 12 }} onClick={() => { setReplyDraft(review.reply.content); setEditingReply(true); }}>수정</button><button className="nbtn nbtn-o" style={{ padding: "5px 12px", fontSize: 12, color: "var(--nerr)" }} onClick={onDeleteReply}>삭제</button></div>}
          </div> : <div>
            <textarea className="ninput" style={{ minHeight: 90, resize: "vertical", lineHeight: 1.5 }} disabled={!canEdit} placeholder="파트너를 대신하여(또는 운영자 안내에 따라) 답글을 작성하세요..." value={replyDraft} onChange={(e) => setReplyDraft(e.target.value)} />
            {canEdit && <div style={{ display: "flex", gap: 8, marginTop: 10, justifyContent: "flex-end" }}>
              {review.reply && <button className="nbtn nbtn-o" style={{ padding: "8px 16px" }} onClick={() => { setReplyDraft(review.reply.content); setEditingReply(false); }}>취소</button>}
              <button className="nbtn nbtn-p" style={{ padding: "8px 16px" }} disabled={!replyDraft.trim()} onClick={() => { onSetReply(replyDraft.trim()); setEditingReply(false); }}>{review.reply ? "답글 수정 저장" : "답글 등록"}</button>
            </div>}
          </div>}
        </div>
      </div>
      <div style={{ padding: 20, background: "var(--nslow)", display: "flex", justifyContent: "flex-end", gap: 12 }}>
        <button className="nbtn nbtn-o" style={{ padding: "10px 20px" }} onClick={onClose}>닫기</button>
        {canEdit && <button className="nbtn nbtn-p" style={{ padding: "10px 20px", background: review.status === "노출" ? "var(--nerr)" : "var(--np)" }} onClick={onToggle}>{review.status === "노출" ? "숨기기" : "노출하기"}</button>}
      </div>
    </div>
  </div>;
}

function ReviewAllPanel({ state, dispatch, toast, canEdit }) {
  const [q, setQ] = useState(""); const [rating, setRating] = useState(""); const [replyFilter, setReplyFilter] = useState(""); const [pg, setPg] = useState(1); const [selId, setSelId] = useState(null);
  const filtered = state.reviews.filter((r) => (!q || [r.facility, r.member].some((v) => v.includes(q))) && (!rating || r.rating === Number(rating)) && (!replyFilter || (replyFilter === "답변완료" ? !!r.reply : !r.reply)));
  const sorted = [...filtered].sort((a, b) => b.id - a.id);
  const PER = 10;
  const pages = Math.max(1, Math.ceil(sorted.length / PER));
  const cur = Math.min(pg, pages);
  const rows = sorted.slice((cur - 1) * PER, cur * PER);
  const selected = selId != null ? state.reviews.find((r) => r.id === selId) : null;
  const exportCsv = () => downloadCSV("reviews_all_" + TODAY, ["작성일", "파트너명", "회원명", "평점", "내용", "답변상태", "답글내용", "노출상태"], sorted.map((r) => [r.date, r.facility, r.member, r.rating, r.content, r.reply ? "답변완료" : "미답변", r.reply ? r.reply.content : "", r.status]));
  const selWrap = (value, onChange, opts, ph) => <div style={{ position: "relative" }}><select className="ninput" style={{ padding: "10px 32px 10px 12px" }} value={value} onChange={onChange}><option value="">{ph}</option>{opts.map(([v, l]) => <option key={v} value={v}>{l}</option>)}</select><span className="msym" style={{ position: "absolute", right: 8, top: "50%", transform: "translateY(-50%)", color: "var(--nol)", fontSize: 18, pointerEvents: "none" }}>expand_more</span></div>;

  return <div style={{ display: "flex", flexDirection: "column", gap: 20 }}>
    <div className="ncard" style={{ padding: 20 }}>
      <div style={{ display: "grid", gridTemplateColumns: "1fr 1fr 2fr", gap: 14, alignItems: "end" }}>
        <div><label className="nlm" style={{ display: "block", marginBottom: 6, color: "var(--nosv)" }}>평점</label>{selWrap(rating, (e) => { setRating(e.target.value); setPg(1); }, [[5, "★5"], [4, "★4"], [3, "★3"], [2, "★2"], [1, "★1"]], "전체 평점")}</div>
        <div><label className="nlm" style={{ display: "block", marginBottom: 6, color: "var(--nosv)" }}>답변 상태</label>{selWrap(replyFilter, (e) => { setReplyFilter(e.target.value); setPg(1); }, [["답변완료", "답변완료"], ["미답변", "미답변"]], "전체")}</div>
        <div style={{ display: "flex", gap: 10, alignItems: "flex-end" }}>
          <div style={{ flex: 1 }}><label className="nlm" style={{ display: "block", marginBottom: 6, color: "var(--nosv)" }}>검색어</label><input className="ninput" placeholder="파트너명, 작성자명" value={q} onChange={(e) => { setQ(e.target.value); setPg(1); }} /></div>
          <button className="nbtn nbtn-o" style={{ display: "inline-flex", alignItems: "center", gap: 6, padding: "11px 18px" }} onClick={exportCsv}><span className="msym" style={{ fontSize: 18 }}>download</span>CSV</button>
        </div>
      </div>
    </div>
    <div className="ncard" style={{ overflow: "hidden" }}>
      <div style={{ overflowX: "auto" }}><table style={{ width: "100%", borderCollapse: "collapse" }}>
        <thead><tr style={{ background: "var(--nslow)", borderBottom: "1px solid var(--nolv)" }}>{["작성일", "파트너명", "작성자", "평점", "내용", "답변", "상태", "관리"].map((h) => <th key={h} className="nlm nmut" style={{ textAlign: h === "관리" || h === "답변" ? "center" : "left", padding: "14px 20px", whiteSpace: "nowrap" }}>{h}</th>)}</tr></thead>
        <tbody>{rows.length === 0 ? <tr><td colSpan="8" style={{ padding: 40, textAlign: "center", color: "var(--nol)" }}>리뷰가 없습니다.</td></tr> : rows.map((r) => <tr key={r.id} style={{ borderBottom: "1px solid rgba(194,198,216,.4)", cursor: "pointer" }} onClick={() => setSelId(r.id)}>
          <td className="nmono" style={{ padding: "14px 20px", color: "var(--nol)" }}>{r.date}</td>
          <td style={{ padding: "14px 20px", fontWeight: 600 }}>{r.facility}</td>
          <td style={{ padding: "14px 20px", color: "var(--nosv)" }}>{r.member}</td>
          <td style={{ padding: "14px 20px", color: "#f59e0b", whiteSpace: "nowrap" }}>{ratingStars(r.rating)}</td>
          <td style={{ padding: "14px 20px", maxWidth: 260, color: "var(--nosv)", overflow: "hidden", textOverflow: "ellipsis", whiteSpace: "nowrap" }}>{r.content}</td>
          <td style={{ padding: "14px 20px", textAlign: "center" }}>{replyBadge(r)}</td>
          <td style={{ padding: "14px 20px" }}>{visBadge(r)}</td>
          <td style={{ padding: "14px 20px", textAlign: "center" }}><button className="nbtn nbtn-o" style={{ padding: "6px 14px", fontSize: 12 }} onClick={(e) => { e.stopPropagation(); setSelId(r.id); }}>상세보기</button></td>
        </tr>)}</tbody>
      </table></div>
      {reviewPager(cur, pages, setPg)}
    </div>
    {selected && <ReviewDetailModal review={selected} canEdit={canEdit} onClose={() => setSelId(null)}
      onToggle={() => { dispatch({ type: "REVIEW_STATUS", id: selected.id, status: selected.status === "노출" ? "숨김" : "노출" }); toast(selected.status === "노출" ? "리뷰를 숨김 처리했습니다." : "리뷰를 다시 노출했습니다."); }}
      onSetReply={(content) => { dispatch({ type: "SET_REVIEW_REPLY", id: selected.id, content, author: selected.facility }); toast("답글이 저장되었습니다."); }}
      onDeleteReply={() => { dispatch({ type: "DELETE_REVIEW_REPLY", id: selected.id }); toast("답글을 삭제했습니다."); }} />}
  </div>;
}

function ReviewByMemberPanel({ state, dispatch, toast, canEdit }) {
  const [q, setQ] = useState(""); const [pg, setPg] = useState(1); const [groupMember, setGroupMember] = useState(null); const [selId, setSelId] = useState(null);
  const byMember = {};
  state.reviews.forEach((r) => { (byMember[r.member] = byMember[r.member] || []).push(r); });
  const groups = Object.entries(byMember).map(([member, list]) => ({ member, list, count: list.length, avgGiven: list.reduce((s, r) => s + r.rating, 0) / list.length, reported: list.filter((r) => r.reportCount > 0).length, lastDate: list.reduce((a, r) => r.date > a ? r.date : a, list[0].date) })).filter((g) => !q || g.member.includes(q)).sort((a, b) => b.count - a.count || b.lastDate.localeCompare(a.lastDate));
  const PER = 10;
  const pages = Math.max(1, Math.ceil(groups.length / PER));
  const cur = Math.min(pg, pages);
  const rows = groups.slice((cur - 1) * PER, cur * PER);
  const selected = selId != null ? state.reviews.find((r) => r.id === selId) : null;
  const activeGroup = groups.find((g) => g.member === groupMember);

  return <div style={{ display: "flex", flexDirection: "column", gap: 20 }}>
    <div className="ncard" style={{ padding: 20 }}><input className="ninput" style={{ maxWidth: 320 }} placeholder="회원명 검색" value={q} onChange={(e) => { setQ(e.target.value); setPg(1); }} /></div>
    <div className="ncard" style={{ overflow: "hidden" }}>
      <div style={{ overflowX: "auto" }}><table style={{ width: "100%", borderCollapse: "collapse" }}>
        <thead><tr style={{ background: "var(--nslow)", borderBottom: "1px solid var(--nolv)" }}>{["회원명", "작성 리뷰 수", "평균 평점(작성)", "신고받은 리뷰", "최근 작성일", "관리"].map((h) => <th key={h} className="nlm nmut" style={{ textAlign: h === "관리" ? "center" : "left", padding: "14px 20px", whiteSpace: "nowrap" }}>{h}</th>)}</tr></thead>
        <tbody>{rows.length === 0 ? <tr><td colSpan="6" style={{ padding: 40, textAlign: "center", color: "var(--nol)" }}>리뷰를 작성한 회원이 없습니다.</td></tr> : rows.map((g) => <tr key={g.member} style={{ borderBottom: "1px solid rgba(194,198,216,.4)" }}>
          <td style={{ padding: "14px 20px", fontWeight: 600 }}>{g.member}</td>
          <td className="nmono" style={{ padding: "14px 20px" }}>{g.count}건</td>
          <td className="nmono" style={{ padding: "14px 20px", color: "#f59e0b" }}>{g.avgGiven.toFixed(1)}</td>
          <td style={{ padding: "14px 20px" }}>{g.reported > 0 ? <span style={{ color: "var(--nerr)", fontWeight: 700 }}>{g.reported}건</span> : "-"}</td>
          <td className="nmono" style={{ padding: "14px 20px", color: "var(--nol)" }}>{g.lastDate}</td>
          <td style={{ padding: "14px 20px", textAlign: "center" }}><button className="nbtn nbtn-o" style={{ padding: "6px 14px", fontSize: 12 }} onClick={() => setGroupMember(g.member)}>리뷰 목록</button></td>
        </tr>)}</tbody>
      </table></div>
      {reviewPager(cur, pages, setPg)}
    </div>
    {activeGroup && <ReviewGroupListModal title={activeGroup.member + " 님이 작성한 리뷰"} reviews={activeGroup.list} metaOf={(r) => r.facility} onClose={() => setGroupMember(null)} onSelectReview={setSelId} />}
    {selected && <ReviewDetailModal review={selected} canEdit={canEdit} onClose={() => setSelId(null)}
      onToggle={() => { dispatch({ type: "REVIEW_STATUS", id: selected.id, status: selected.status === "노출" ? "숨김" : "노출" }); toast(selected.status === "노출" ? "리뷰를 숨김 처리했습니다." : "리뷰를 다시 노출했습니다."); }}
      onSetReply={(content) => { dispatch({ type: "SET_REVIEW_REPLY", id: selected.id, content, author: selected.facility }); toast("답글이 저장되었습니다."); }}
      onDeleteReply={() => { dispatch({ type: "DELETE_REVIEW_REPLY", id: selected.id }); toast("답글을 삭제했습니다."); }} />}
  </div>;
}

function ReviewByPartnerPanel({ state, dispatch, toast, canEdit }) {
  const [q, setQ] = useState(""); const [pg, setPg] = useState(1); const [groupFacility, setGroupFacility] = useState(null); const [selId, setSelId] = useState(null);
  const byFacility = {};
  state.reviews.forEach((r) => { (byFacility[r.facility] = byFacility[r.facility] || []).push(r); });

          <td style={{ padding: "14px 20px" }}>{g.reported > 0 ? <span style={{ color: "var(--nerr)", fontWeight: 700 }}>{g.reported}건</span> : "-"}</td>

function CommonCodePage({ state, dispatch, toast, canEdit }) {
  const [gi, setGi] = useState(0); const [newCode, setNewCode] = useState(""); const [newLabel, setNewLabel] = useState(""); const [edit, setEdit] = useState(null);

    dispatch({ type: "ADD_CODE", groupKey: group.key, code, label });

  };
  return <div className="noti"><div style={{ display: "flex", flexDirection: "column", gap: 20 }}>

      <div style={{ display: "grid", gridTemplateColumns: "1fr 1fr auto", gap: 14, alignItems: "end" }}>
        <div><label className="nlm" style={{ display: "block", marginBottom: 6, color: "var(--nosv)" }}>코드값</label><input className="ninput" placeholder="예: yoga" value={newCode} onChange={(e) => setNewCode(e.target.value)} /></div>

        <button className="nbtn nbtn-p" style={{ padding: "11px 20px" }} onClick={add}>코드 추가</button>
      </div>
    </div>}

    <div className="ncard" style={{ overflow: "hidden" }}>
      <table style={{ width: "100%", borderCollapse: "collapse" }}>
        <thead><tr style={{ background: "var(--nslow)", borderBottom: "1px solid var(--nolv)" }}>{["코드값", "표시명", "상태", "관리"].map((h) => <th key={h} className="nlm nmut" style={{ textAlign: h === "관리" || h === "상태" ? "center" : "left", padding: "14px 20px" }}>{h}</th>)}</tr></thead>
        <tbody>{group.codes.length === 0 ? <tr><td colSpan="4" style={{ padding: 40, textAlign: "center", color: "var(--nol)" }}>등록된 코드가 없습니다.</td></tr> : group.codes.map((c) => <tr key={c.code} style={{ borderBottom: "1px solid rgba(194,198,216,.4)", opacity: c.active ? 1 : .5 }}>
          <td className="nmono" style={{ padding: "14px 20px" }}>{c.code}</td>
          <td style={{ padding: "14px 20px", fontWeight: 600 }}>{c.label}</td>
          <td style={{ padding: "14px 20px", textAlign: "center" }}><button className={"switch" + (c.active ? " on" : "")} disabled={!canEdit} onClick={() => { dispatch({ type: "TOGGLE_CODE", groupKey: group.key, code: c.code }); toast((c.active ? "비활성화" : "활성화") + "했습니다."); }} style={{ display: "inline-block" }} /></td>
          <td style={{ padding: "14px 20px", textAlign: "center" }}>{canEdit ? <button className="nbtn nbtn-o" style={{ padding: "6px 14px", fontSize: 12 }} onClick={() => setEdit(c)}>수정</button> : <span className="nmut">-</span>}</td>
        </tr>)}</tbody>
      </table>
    </div>

    {edit && <NModal title="코드 표시명 수정" onClose={() => setEdit(null)} w={420} footer={<><button className="nbtn nbtn-o" style={{ padding: "10px 20px" }} onClick={() => setEdit(null)}>취소</button><button className="nbtn nbtn-p" style={{ padding: "10px 20px" }} onClick={() => { dispatch({ type: "UPDATE_CODE", groupKey: group.key, code: edit.code, patch: { label: edit.label } }); toast("저장되었습니다."); setEdit(null); }}>저장</button></>}>
      <div><label className="nlm" style={{ display: "block", marginBottom: 6, color: "var(--nosv)" }}>코드값</label><div className="nmono" style={{ padding: "10px 12px", borderRadius: 8, background: "var(--nslow)", color: "var(--nosv)" }}>{edit.code}</div></div>

    </NModal>}
  </div></div>;
}

const INSTRUCTORS = ["김지혜", "박서준", "이도현", "최유나", "정민수", "한소희", "오세훈", "나윤서"];
const classInstructor = (c) => INSTRUCTORS[String(c.id).charCodeAt(String(c.id).length - 1) % INSTRUCTORS.length];
const classEnrolled = (c) => { const s = String(c.id); let h = 0; for (let i = 0; i < s.length; i++) h += s.charCodeAt(i); return Math.max(1, (h % c.capacity) + 1); };
const classDispStatus = (c) => { if (c.reviewStatus === "수정완료") return "수정완료"; if (c.reviewStatus === "resolved") return "운영중"; if (c.reviewStatus === "중지") return "비노출"; if (c.reviewStatus === "수정요청") return "수정요청"; const h = String(c.id).charCodeAt(String(c.id).length - 1); return c.status === "진행" ? (h % 7 === 0 ? "수정요청" : "운영중") : (h % 2 === 0 ? "비노출" : "종료"); };
const classLastMod = (c) => { const d = new Date(c.createdAt); d.setDate(d.getDate() + (String(c.id).charCodeAt(0) % 25) + 2); const t = new Date(TODAY); return (d > t ? t : d).toISOString().slice(0, 10); };
const classStatusStyle = (s) => s === "운영중" ? { fg: "var(--green)", bg: "var(--green-bg)", dot: "#0BA360" } : s === "수정요청" ? { fg: "var(--orange)", bg: "var(--orange-bg)", dot: "#D97706" } : s === "수정완료" ? { fg: "var(--np)", bg: "var(--primary-bg)", dot: "var(--np)" } : s === "비노출" ? { fg: "var(--nosv)", bg: "var(--nsch)", dot: "var(--nol)" } : { fg: "var(--nerr)", bg: "var(--red-bg)", dot: "var(--nerr)" };
const classStatusPill = (s) => { const st = classStatusStyle(s); return <span style={{ display: "inline-flex", alignItems: "center", gap: 6, padding: "3px 10px", borderRadius: 99, background: st.bg, color: st.fg, fontSize: 11, fontWeight: 700, whiteSpace: "nowrap" }}><span style={{ width: 6, height: 6, borderRadius: 99, background: st.dot }} />{s}</span>; };

function ClassManagePage({ state, dispatch, toast, canEdit }) {
  const [tab, setTab] = useState("전체");
  const [cat, setCat] = useState(""); const [q, setQ] = useState(""); const [from, setFrom] = useState(""); const [to, setTo] = useState(""); const [pg, setPg] = useState(1); const [detailId, setDetailId] = useState(null);

  const all = state.classes.map((c) => ({ ...c, disp: classDispStatus(c), instr: classInstructor(c), enrolled: classEnrolled(c) }));
  const detail = detailId ? all.find((c) => c.id === detailId) : null;
  const tabs = ["전체", "운영중", "수정요청", "수정완료", "비노출", "종료"];
  const reqCount = all.filter((c) => c.disp === "수정요청").length;
  const filtered = all.filter((c) => (tab === "전체" || c.disp === tab) && (!cat || c.category === cat) && inRange(c.createdAt, from, to) && (!q || [c.name, c.partner, c.instr].some((v) => v.includes(q)))).sort((a, b) => String(b.createdAt).localeCompare(String(a.createdAt)));
  const PER = 10;
  const pages = Math.max(1, Math.ceil(filtered.length / PER));
  const cur = Math.min(pg, pages);
  const rows = filtered.slice((cur - 1) * PER, cur * PER);
  const startIdx = filtered.length ? (cur - 1) * PER + 1 : 0;
  const endIdx = Math.min(cur * PER, filtered.length);

  const reset = () => { setCat(""); setQ(""); setFrom(""); setTo(""); setPg(1); };

        <div style={{ width: 180 }}><label style={fLabel}>카테고리</label><div style={{ position: "relative" }}><select className="ninput" style={{ height: 42, padding: "0 36px 0 12px" }} value={cat} onChange={(e) => { setCat(e.target.value); setPg(1); }}><option value="">전체 카테고리</option>{CATS.map((o) => <option key={o} value={o}>{o}</option>)}</select><span className="msym" style={{ position: "absolute", right: 12, top: "50%", transform: "translateY(-50%)", color: "var(--nol)", fontSize: 20, pointerEvents: "none" }}>expand_more</span></div></div>
