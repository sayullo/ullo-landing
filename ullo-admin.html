        <div style={{ width: 270 }}><label style={fLabel}>기간 선택</label><div style={{ display: "flex", alignItems: "center", gap: 8, border: "1px solid var(--nolv)", borderRadius: 8, padding: "0 12px", height: 42, background: "#fff" }}><input type="date" value={from} onChange={(e) => { setFrom(e.target.value); setPg(1); }} style={{ border: "none", outline: "none", fontSize: 12, background: "none", color: "var(--nos)", flex: 1, minWidth: 0 }} /><span style={{ color: "var(--nol)" }}>~</span><input type="date" value={to} onChange={(e) => { setTo(e.target.value); setPg(1); }} style={{ border: "none", outline: "none", fontSize: 12, background: "none", color: "var(--nos)", flex: 1, minWidth: 0 }} /></div></div>
        <div style={{ display: "flex", gap: 8, marginLeft: "auto" }}><button className="nbtn nbtn-g" style={{ padding: "0 16px", height: 42 }} onClick={reset}>초기화</button><button className="nbtn nbtn-p" style={{ padding: "0 24px", height: 42 }} onClick={() => { setPg(1); toast && toast("검색이 적용되었습니다."); }}>검색</button></div>
      </div>
    </div>

    <div style={{ display: "flex", justifyContent: "space-between", alignItems: "center", flexWrap: "wrap", gap: 12 }}>
      <div style={{ display: "flex", alignItems: "center", gap: 12 }}><span className="nbm" style={{ fontWeight: 700 }}>총 {fmt(filtered.length)}건</span><span style={{ width: 1, height: 14, background: "var(--nolv)" }} /><span style={{ fontSize: 12, color: "var(--nol)" }}>최신순 정렬</span></div>
      <button className="nbtn" style={{ display: "inline-flex", alignItems: "center", gap: 6, padding: "8px 16px", border: "1px solid var(--np)", background: "#fff", color: "var(--np)", fontWeight: 700, fontSize: 12 }} onClick={exportCsv}><span className="msym" style={{ fontSize: 18 }}>download</span>CSV 다운로드</button>
    </div>

    <div className="ncard" style={{ overflow: "hidden" }}>
      <div style={{ overflowX: "auto" }}>
        <table style={{ width: "100%", borderCollapse: "collapse" }}>
          <thead><tr style={{ background: "var(--nslow)", borderBottom: "1px solid var(--nolv)" }}>
            {[["카테고리", "left"], ["클래스명", "left"], ["업체명", "left"], ["강사명", "left"], ["수강인원", "center"], ["상태", "center"], ["등록일", "left"], ["최종수정일", "left"]].map(([h, a]) => <th key={h} className="nls nmut" style={{ textAlign: a, padding: "14px 20px", whiteSpace: "nowrap", textTransform: "uppercase", letterSpacing: ".03em" }}>{h}</th>)}
          </tr></thead>
          <tbody>
            {rows.length === 0 ? <tr><td colSpan="8" style={{ padding: 48, textAlign: "center", color: "var(--nol)" }}>조회된 클래스가 없습니다.</td></tr> : rows.map((c) => <tr key={c.id} style={{ borderBottom: "1px solid var(--nolv)" }}>
              <td style={{ padding: "16px 20px", whiteSpace: "nowrap", color: "var(--nosv)" }}>{c.category}</td>
              <td style={{ padding: "16px 20px", whiteSpace: "nowrap" }}><button onClick={() => setDetailId(c.id)} style={{ border: "none", background: "none", cursor: "pointer", color: "var(--np)", fontWeight: 700, fontSize: 14, padding: 0, textAlign: "left" }} onMouseEnter={(e) => e.currentTarget.style.textDecoration = "underline"} onMouseLeave={(e) => e.currentTarget.style.textDecoration = "none"}>{c.name}</button></td>
              <td style={{ padding: "16px 20px", whiteSpace: "nowrap", color: "var(--nos)", fontWeight: 600 }}>{c.partner}</td>
              <td style={{ padding: "16px 20px", whiteSpace: "nowrap", color: "var(--nosv)" }}>{c.instr}</td>
              <td style={{ padding: "16px 20px", whiteSpace: "nowrap", textAlign: "center", color: "var(--nosv)" }}>{c.enrolled}/{c.capacity}</td>
              <td style={{ padding: "16px 20px", whiteSpace: "nowrap", textAlign: "center" }}>{classStatusPill(c.disp)}</td>
              <td className="nmono" style={{ padding: "16px 20px", whiteSpace: "nowrap", color: "var(--nol)", fontSize: 12 }}>{c.createdAt}</td>
              <td className="nmono" style={{ padding: "16px 20px", whiteSpace: "nowrap", color: "var(--nol)", fontSize: 12 }}>{classLastMod(c)}</td>
            </tr>)}
          </tbody>
        </table>
      </div>
      <div style={{ padding: "16px 20px", borderTop: "1px solid var(--nolv)", background: "var(--nslow)", display: "flex", alignItems: "center", justifyContent: "space-between", flexWrap: "wrap", gap: 12 }}>
        <div className="nbm nmut">{filtered.length ? startIdx + "–" + endIdx + " / 총 " + fmt(filtered.length) + "개 클래스" : "결과 없음"}</div>
        <div style={{ display: "flex", alignItems: "center", gap: 4 }}>
          <button style={navBtn(cur === 1)} onClick={() => cur > 1 && setPg(cur - 1)}><span className="msym" style={{ fontSize: 18 }}>chevron_left</span></button>
          {Array.from({ length: pages }, (_, i) => i + 1).map((p) => <button key={p} style={pageBtn(p === cur)} onClick={() => setPg(p)}>{p}</button>)}
          <button style={navBtn(cur === pages)} onClick={() => cur < pages && setPg(cur + 1)}><span className="msym" style={{ fontSize: 18 }}>chevron_right</span></button>
        </div>
      </div>
    </div>

    {detail && <ClassDetailModal c={detail} onClose={() => setDetailId(null)} toast={toast} dispatch={dispatch} canEdit={canEdit} />}
  </div></div>;
}

function FeePanel({ state, dispatch, toast, canEdit }) {
  const [region, setRegion] = useState(""); const [edit, setEdit] = useState(null); const [rate, setRate] = useState("");
  const rows = state.partners.filter((p) => p.status !== "탈퇴" && regionMatch(p.region, region));
  const cols = [{ key: "facility", label: "시설명", render: (p) => <b>{p.facility}</b> }, { key: "category", label: "카테고리" }, { key: "region", label: "지역" }, { key: "feeRate", label: "수수료율", render: (p) => <span>{p.feeRate}%{p.feeRate !== FEE_RATE && <span className="badge badge-purple badge-mini">개별</span>}</span>, csv: (p) => p.feeRate + "%" }, { key: "_", label: "관리", noCsv: true, render: (p) => canEdit ? <button className="btn btn-outline btn-sm" onClick={() => { setEdit(p); setRate(String(p.feeRate)); }}>수수료 조정</button> : <span className="muted">권한 없음</span> }];
  return <div>
    <div className="muted" style={{ marginBottom: 12, fontSize: 13 }}>기본 수수료율 {FEE_RATE}% 단일 고정 · 파트너별 개별 조정 가능</div>
    <DataTable columns={cols} rows={rows} search={(p) => [p.facility, p.category]} searchPlaceholder="시설명 검색" toolbar={<RegionSelect value={region} onChange={setRegion} />} csvName={"fees_" + TODAY + ".csv"} />
    {edit && <Modal title="수수료율 조정" onClose={() => setEdit(null)}><div className="muted" style={{ marginBottom: 12 }}><b>{edit.facility}</b> · 기본 {FEE_RATE}%</div><div className="field"><label>수수료율 (%)</label><input className="input" type="number" min="0" max="100" value={rate} onChange={(e) => setRate(e.target.value)} /></div><div className="modal-actions"><button className="btn btn-outline" onClick={() => { dispatch({ type: "PARTNER_FEE", id: edit.id, rate: FEE_RATE }); toast(edit.facility + " 기본값 " + FEE_RATE + "%로 초기화"); setEdit(null); }}>기본값</button><button className="btn btn-primary" disabled={rate === "" || Number(rate) < 0} onClick={() => { dispatch({ type: "PARTNER_FEE", id: edit.id, rate: Number(rate) }); toast(edit.facility + " 수수료율 " + rate + "%"); setEdit(null); }}>저장</button></div></Modal>}
  </div>;
}
function PartnerBenefitPage(props) {

}
const feeMethodBadge = (p) => p.isReserve

const feeStatusBadge = (p) => p.status === "정지"

  : <span className="badge badge-green">적용중</span>;

function FeeSettingPage({ state, dispatch, toast, canEdit }) {

    { key: "_m", label: "산정방식", render: feeMethodBadge, csv: (p) => p.isReserve ? "사전예약 고정" : "표준 자동" },

    <DataTable columns={cols} rows={rows} search={(p) => [p.facility, p.category, p.region]} searchPlaceholder="시설명 검색" toolbar={<>{catSel}<RegionSelect value={region} onChange={setRegion} /></>} onRowClick={(p) => setSel(p.id)} csvName={"fee_settings_" + TODAY + ".csv"} emptyText="대상 시설이 없습니다." />

const FEE_DISC_SAMPLE = [10, 30, 5, 50, 20, 0];

  const clsRows = classes.map((c, i) => { const disc = FEE_DISC_SAMPLE[i % FEE_DISC_SAMPLE.length]; const std = stdFeeRate(disc); return { name: c.name, disc, std, applied: p.isReserve ? p.feeRate : std }; });

  const toReserve = () => { dispatch({ type: "PARTNER_RESERVE", id: p.id, value: true }); if (p.feeRate === FEE_RATE) { dispatch({ type: "PARTNER_FEE", id: p.id, rate: 12 }); setRate("12"); } toast(p.facility + " 사전예약 우대 조건으로 전환"); };

        <button className="btn btn-outline" onClick={onBack}>취소</button>
        <button className="btn btn-primary" onClick={save} disabled={!p.isReserve} title={p.isReserve ? "" : "표준 자동 산정은 수수료율이 자동 계산됩니다."}>변경사항 저장</button>

/* ============================================================
   정산 엑셀 업로드 (SheetJS) · 자동 계산 로직
============================================================ */
// 자동 계산 함수 — 모든 업로드에 동일 적용 (엑셀의 ④~⑦ 값은 무시하고 재계산)
function calculateSettlement(creditUsed, claimAmount, discountRate) {
  const total = creditUsed * 3000;                                            // ② 합계금액
  const subtotal = total - claimAmount;                                       // ④ 소계
  const feeRate = Math.max(0.15, 0.20 - Math.floor(discountRate * 100 / 10) * 0.01); // ⑤ 수수료율
  const fee = subtotal * feeRate;                                             // ⑥ 판매수수료
  const settlement = subtotal - fee;                                          // ⑦ 정산금액
  return { total, subtotal, feeRate, fee, settlement };
}
// 셀 값 정규화
const sNum = (v) => Number(String(v == null ? "" : v).replace(/[^0-9.\-]/g, "")) || 0;
const sRate = (v) => { let d = parseFloat(String(v == null ? "" : v).replace(/[^0-9.\-]/g, "")) || 0; if (d > 1) d = d / 100; return d; }; // "15%"·15·0.15 → 0.15
// 업로드 행 파싱 — 방식 A: [파트너명,클래스명,정가,할인율,크레딧사용량,클레임금액] / 방식 B: [클래스명,정가,할인율,크레딧사용량,클레임금액]
function parseSettlementRows(aoa, mode, fixedPartner) {
  const body = (aoa || []).slice(1).filter((r) => r && r.some((c) => c !== "" && c != null));
  return body.map((r) => {
    let partner, className, price, disc, credit, claim;
    if (mode === "A") { partner = r[0]; className = r[1]; price = r[2]; disc = r[3]; credit = r[4]; claim = r[5]; }
    else { className = r[0]; price = r[1]; disc = r[2]; credit = r[3]; claim = r[4]; partner = fixedPartner; }
    const discountRate = sRate(disc); const creditUsed = sNum(credit); const claimAmount = sNum(claim);
    return { partner: String(partner || "").trim(), className: String(className || "").trim(), price: sNum(price), discountRate, creditUsed, claim: claimAmount, ...calculateSettlement(creditUsed, claimAmount, discountRate) };
  }).filter((r) => r.className && r.partner);
}
// 파트너명 기준 groupBy + 그룹별 합계 + 가중평균 수수료율
function groupSettlements(rows) {
  const map = {};
  rows.forEach((r) => { (map[r.partner] = map[r.partner] || []).push(r); });
  return Object.keys(map).map((partner) => {
    const cls = map[partner];
    const sum = (k) => cls.reduce((s, r) => s + r[k], 0);
    const total = sum("total"), claim = sum("claim"), subtotal = sum("subtotal"), fee = sum("fee"), settlement = sum("settlement"), credits = sum("creditUsed");
    return { partner, classes: cls, total, claim, subtotal, fee, settlement, credits, feeRate: subtotal ? fee / subtotal : 0 }; // 가중평균 = Σ판매수수료 / Σ소계
  });
}

function SettlementDetailView({ s, state, dispatch, toast, canEdit, onBack, onUpload }) {

    const per = Math.floor(totalCredits / base.length); const rem = totalCredits - per * base.length;
    return base.map((c, i) => { const creditUsed = per + (i < rem ? 1 : 0); return { className: c.name, classId: "CL-" + String(i + 1).padStart(3, "0"), price: c.price || 0, discountRate: 0, creditUsed, claim: 0, ...calculateSettlement(creditUsed, 0, 0) }; });
  };
  const cls = buildClasses();

  const avgRate = T.subtotal ? T.fee / T.subtotal : 0;

  const exportCsv = () => downloadCSV("settlement_" + s.partner, ["클래스명", "정가", "할인율", "사용크레딧", "합계금액", "클레임금액", "소계", "수수료율", "판매수수료", "정산금액"], cls.map((c) => [c.className, Math.round(c.price), pct(c.discountRate), c.creditUsed, Math.round(c.total), Math.round(c.claim), Math.round(c.subtotal), pct(c.feeRate), Math.round(c.fee), Math.round(c.settlement)]));
  const confirm = () => { if (s.status === "정산예정") { dispatch({ type: "SETTLE_STATUS", id: s.id, status: "정산완료" }); toast && toast(s.partner + " 정산 확정 처리"); } };

}

function SettlementPage({ state, dispatch, toast, canEdit }) {
  const [cat, setCat] = useState(""); const [q, setQ] = useState(""); const [fromM, setFromM] = useState(""); const [toM, setToM] = useState(""); const [pg, setPg] = useState(1);
  const [upload, setUpload] = useState(false); const [detail, setDetail] = useState(null);

  const partnerCat = (facility) => { const p = state.partners.find((x) => x.facility === facility); return p ? p.category : ""; };
  const monthsOf = (period) => String(period || "").match(/\d{4}-\d{2}/g) || [];
  const inMonthRange = (period) => { if (!fromM && !toM) return true; const ms = monthsOf(period); if (ms.length === 0) return true; return ms.some((m) => (!fromM || m >= fromM) && (!toM || m <= toM)); };
  const filtered = state.settlements.filter((s) => (!cat || partnerCat(s.partner) === cat) && (!q || s.partner.includes(q)) && inMonthRange(s.period));

  const sum = (fn) => filtered.reduce((a, s) => a + fn(settleView(s)), 0);
  const tGross = sum((v) => v.gross), tClaim = sum((v) => v.claim), tSub = sum((v) => v.subtotal), tFee = sum((v) => v.fee), tPayout = sum((v) => v.payout);
  const tCredits = filtered.reduce((a, s) => a + (s.count || 0), 0);
  const avgRate = tSub ? tFee / tSub : 0;
  // 전월 대비 평균 매출 증가 — 파트너별 전월 매출을 결정적으로 시뮬레이션해 성장률 평균 산출
  const prevGross = (s) => { let h = 0; const k = String(s.partner) + s.gross; for (let i = 0; i < k.length; i++) h = (h * 31 + k.charCodeAt(i)) % 20; return s.gross / (1 + (4 + h) / 100); }; // 전월 대비 4~23% 성장(파트너·매출 해시)
  const growthRates = filtered.filter((s) => s.gross > 0).map((s) => { const p = prevGross(s); return p ? (s.gross - p) / p : 0; });
  const avgGrowth = growthRates.length ? growthRates.reduce((a, b) => a + b, 0) / growthRates.length : 0;

  const PER = 10;
  const pages = Math.max(1, Math.ceil(filtered.length / PER));
  const cur = Math.min(pg, pages);
  const rows = filtered.slice((cur - 1) * PER, cur * PER);
  const cats = [...new Set(state.partners.map((p) => p.category))];

  const exportCsv = () => downloadCSV("settlements_" + TODAY, ["파트너명", "정산기간", "합계금액", "클레임금액", "소계", "평균수수료율", "판매수수료", "정산금액", "상태"], filtered.map((s) => { const v = settleView(s); return [s.partner, s.period, Math.round(v.gross), Math.round(v.claim), Math.round(v.subtotal), (v.feeRate * 100).toFixed(1) + "%", Math.round(v.fee), Math.round(v.payout), s.status]; }));
  const rowCsv = (s) => { const v = settleView(s); downloadCSV("settlement_" + s.partner, ["항목", "값"], [["파트너명", s.partner], ["정산기간", s.period], ["합계금액(②)", Math.round(v.gross)], ["클레임금액(③)", Math.round(v.claim)], ["소계(④)", Math.round(v.subtotal)], ["평균수수료율(⑤)", (v.feeRate * 100).toFixed(1) + "%"], ["판매수수료(⑥)", Math.round(v.fee)], ["정산금액(⑦)", Math.round(v.payout)], ["상태", s.status]]); };
  const pct = (d) => (d * 100).toFixed(1) + "%";
  const card = (label, value, sub, accent) => <div className="ncard" style={{ padding: 16, display: "flex", flexDirection: "column", gap: 6, background: accent === "p" ? "rgba(0,78,203,.05)" : accent === "g" ? "#E6F7EF" : "#fff", borderColor: accent === "p" ? "rgba(0,78,203,.2)" : accent === "g" ? "rgba(11,163,96,.2)" : "var(--nolv)" }}><span style={{ fontSize: 11, fontWeight: 700, textTransform: "uppercase", letterSpacing: ".02em", color: accent === "p" ? "var(--np)" : accent === "g" ? "var(--green)" : "var(--nosv)" }}>{label}</span><div style={{ display: "flex", alignItems: "baseline", gap: 6 }}><span className="nmono" style={{ fontSize: accent ? 24 : 20, fontWeight: 800, color: accent === "p" ? "var(--np)" : accent === "g" ? "var(--green)" : "var(--nos)" }}>{value}</span>{sub && <span style={{ fontSize: 11, color: "var(--nol)" }}>{sub}</span>}</div></div>;
  const navBtn = (dis) => ({ width: 38, height: 38, borderRadius: 8, border: "1px solid var(--nolv)", background: "#fff", color: "var(--nosv)", cursor: dis ? "not-allowed" : "pointer", opacity: dis ? .4 : 1, display: "inline-flex", alignItems: "center", justifyContent: "center" });
  const pageBtn = (on) => ({ width: 38, height: 38, borderRadius: 8, border: on ? "1px solid var(--np)" : "1px solid var(--nolv)", background: on ? "var(--np)" : "#fff", color: on ? "#fff" : "var(--nos)", fontWeight: 700, fontSize: 13, cursor: "pointer" });
  const ico = { padding: 6, borderRadius: 6, border: "none", background: "none", cursor: "pointer", color: "var(--nosv)", display: "inline-flex" };
  const th = (label, align) => <th style={{ padding: "16px 20px", textAlign: align, fontSize: 12, fontWeight: 700, textTransform: "uppercase", letterSpacing: ".03em", color: "var(--nos)", whiteSpace: "nowrap" }}>{label}</th>;

  return <div className="noti">{detail ? <SettlementDetailView s={detail} state={state} dispatch={dispatch} toast={toast} canEdit={canEdit} onBack={() => setDetail(null)} onUpload={() => setUpload(true)} /> : <div style={{ display: "flex", flexDirection: "column", gap: 20 }}>

    <div style={{ display: "grid", gridTemplateColumns: "repeat(4,1fr)", gap: 16 }}>
      {card("이번달 총 매출", fmt(Math.round(tGross)), "원 (" + fmt(tCredits) + " C)")}
      {card("ullo 수수료 수익", wonP(tFee), "", "p")}
      {card("파트너 정산 총액", wonP(tPayout), "", "g")}
      <div className="ncard" style={{ padding: 16, display: "flex", flexDirection: "column", gap: 6 }}><span style={{ fontSize: 11, fontWeight: 700, textTransform: "uppercase", letterSpacing: ".02em", color: "var(--nosv)" }}>전월 대비 성장</span><div style={{ display: "flex", alignItems: "center", gap: 4, color: "var(--green)" }}><span className="msym" style={{ fontSize: 22 }}>trending_up</span><span className="nmono" style={{ fontSize: 20, fontWeight: 800 }}>{(avgGrowth * 100).toFixed(1)}%</span></div><span style={{ fontSize: 11, color: "var(--nol)" }}>전월 대비 평균 매출 증가</span></div>
    </div>

    <div className="ncard" style={{ padding: 24 }}>
      <div style={{ display: "flex", flexWrap: "wrap", alignItems: "flex-end", justifyContent: "space-between", gap: 20 }}>
        <div style={{ display: "flex", flexWrap: "wrap", alignItems: "flex-end", gap: 20 }}>
          <div><label style={{ display: "block", fontSize: 13, fontWeight: 600, color: "var(--nosv)", marginBottom: 8 }}>카테고리</label><div style={{ position: "relative", minWidth: 160 }}><select className="ninput" style={{ height: 40, padding: "0 32px 0 12px" }} value={cat} onChange={(e) => { setCat(e.target.value); setPg(1); }}><option value="">전체 카테고리</option>{cats.map((c) => <option key={c} value={c}>{c}</option>)}</select><span className="msym" style={{ position: "absolute", right: 10, top: "50%", transform: "translateY(-50%)", color: "var(--nol)", fontSize: 18, pointerEvents: "none" }}>expand_more</span></div></div>
          <div><label style={{ display: "block", fontSize: 13, fontWeight: 600, color: "var(--nosv)", marginBottom: 8 }}>파트너 검색</label><div style={{ position: "relative" }}><input className="ninput" style={{ height: 40, width: 280, paddingRight: 36 }} placeholder="파트너명을 입력하세요" value={q} onChange={(e) => { setQ(e.target.value); setPg(1); }} /><span className="msym" style={{ position: "absolute", right: 10, top: "50%", transform: "translateY(-50%)", color: "var(--nol)", fontSize: 18 }}>search</span></div></div>

        <div style={{ display: "flex", gap: 8 }}>
          <button className="nbtn nbtn-o" style={{ display: "inline-flex", alignItems: "center", gap: 6, height: 40, padding: "0 14px" }} onClick={exportCsv}><span className="msym" style={{ fontSize: 18 }}>description</span>엑셀 다운로드</button>

    </div>
    {sel && <div className="card p-tight"><div className="section-title" style={{ padding: "14px 12px 4px" }}>지급 내역 (반환 가능)</div><div className="table-wrap"><table>
      <thead><tr><th>일시</th><th>크레딧</th><th>사유</th><th>관리</th></tr></thead>
      <tbody>{grantLogs.length === 0 ? <tr><td colSpan="4" className="empty">반환 가능한 지급 내역이 없습니다.</td></tr> : grantLogs.map((l) => <tr key={l.id}><td>{l.date}</td><td style={{ color: "var(--primary)", fontWeight: 700 }}>+{l.amount}c</td><td>{l.reason}</td><td><button className="btn btn-outline btn-sm" onClick={() => setConfirm({ kind: "반환", log: l })}>반환</button></td></tr>)}</tbody>
    </table></div></div>}
    {confirm && confirm.kind === "차감" && <Modal title="크레딧 차감" onClose={() => setConfirm(null)}><div className="field"><label>차감 크레딧 수 (c)</label><input className="input" type="number" min="1" max={sel.credits} value={amount} onChange={(e) => setAmount(e.target.value)} /></div><div className="field"><label>사유</label><input className="input" value={reason} onChange={(e) => setReason(e.target.value)} placeholder="차감 사유" /></div><div className="modal-actions"><button className="btn btn-outline" onClick={() => setConfirm(null)}>취소</button><button className="btn btn-danger" disabled={!amount || Number(amount) <= 0} onClick={() => { dispatch({ type: "DEDUCT_CREDIT", memberId: sel.id, amount: Number(amount), reason }); toast(sel.name + " " + amount + "c 차감"); setConfirm(null); }}>차감</button></div></Modal>}
    {confirm && confirm.kind === "반환" && <ConfirmModal title="크레딧 반환" confirmText="반환" message={<span><b>{sel.name}</b>님의 지급({confirm.log.amount}c)을 반환합니다. 잔액이 차감됩니다.</span>} onClose={() => setConfirm(null)} onConfirm={() => { dispatch({ type: "RETURN_CREDIT", id: confirm.log.id }); toast("반환 완료"); setConfirm(null); }} />}
    {confirm && confirm.kind === "전량삭제" && <ConfirmModal title="크레딧 전량 삭제" danger confirmText="전량 삭제" message={<span><b>{sel.name}</b>님의 보유 크레딧 {cc(sel.credits)}을 전량 삭제합니다. 되돌릴 수 없습니다.</span>} onClose={() => setConfirm(null)} onConfirm={() => { dispatch({ type: "DEDUCT_CREDIT", memberId: sel.id, amount: sel.credits, reason: "전량 삭제" }); toast(sel.name + " 크레딧 전량 삭제"); setConfirm(null); }} />}
  </div>;
}
const couponEffStatus = (c) => c.end < TODAY ? "종료" : c.start > TODAY ? "예정" : c.status;
const couponStatusBadge = (s) => <span className={"badge " + (s === "진행중" ? "badge-green" : s === "예정" ? "badge-blue" : s === "일시정지" ? "badge-orange" : "badge-gray")}>{s}</span>;
const couponBenefit = (c) => (c.credits ? cc(c.credits) + " 지급" : "") + (c.discount ? (c.credits ? " · " : "") + c.discount + "% 할인" : "") || "-";
const recipBadge = (s) => <span className={"badge " + (s === "사용완료" ? "badge-green" : s === "기간만료" ? "badge-red" : "badge-blue")}>{s}</span>;
function couponRecipients(coupon, members) {
  const ended = coupon.end < TODAY; const n = Math.min(8, members.length);
  return members.slice(0, n).map((m, i) => {
    const used = i % 3 === 0; const expired = !used && ended && i % 3 === 1;
    return { id: m.id, name: m.name, email: m.email,
      issuedAt: coupon.start + " " + pad(9 + (i % 9)) + ":" + pad((i * 13) % 60),
      usedAt: used ? coupon.start + " " + pad(10 + (i % 8)) + ":" + pad((i * 7) % 60) : "-",
      status: used ? "사용완료" : expired ? "기간만료" : "발급완료" };
  });
}

/* 크레딧 - 상단 페이지들 */
const creditStatusOf = (m) => m.credits <= 0 ? "사용완료" : m.creditExpiry < TODAY ? "만료" : m.creditExpiry <= daysAhead(30) ? "만료예정" : "보유중";
const creditStatusBadge = (s) => <span className={"badge " + (s === "보유중" ? "badge-green" : s === "만료예정" ? "badge-orange" : s === "만료" ? "badge-red" : "badge-gray")}>{s}</span>;
const memberHandle = (m) => String(m.email || "").split("@")[0] || ("user" + m.id);
const creditAgg = (logs, mid, fallbackDate) => {
  const ls = logs.filter((l) => l.memberId === mid);
  const granted = ls.filter((l) => l.type === "지급").reduce((s, l) => s + l.amount, 0);
  const used = Math.abs(ls.filter((l) => l.type === "차감").reduce((s, l) => s + l.amount, 0));
  const expired = Math.abs(ls.filter((l) => l.type === "소멸").reduce((s, l) => s + l.amount, 0));
  const gDates = ls.filter((l) => l.type === "지급").map((l) => l.date.slice(0, 10)).sort();
  return { granted, used, expired, firstGrant: gDates[0] || fallbackDate, logs: ls };
};

  const usedCnt = state.creditLogs.filter((l) => l.type === "차감").length;
  const remain = state.members.reduce((s, m) => s + m.credits, 0);

  if (label === "크레딧 만료 예정") return m.credits > 0 && m.creditExpiry >= TODAY && m.creditExpiry <= daysAhead(7);
  return true;
});

============================================================ */
function weekKey(dstr) { const d = new Date(dstr); const day = (d.getDay() + 6) % 7; d.setDate(d.getDate() - day); return toISO(d) + " 주"; }
function SalesStatus({ state }) {
  const [from, setFrom] = useState(""); const [to, setTo] = useState(""); const [partnerF, setPartnerF] = useState(""); const [catF, setCatF] = useState(""); const [view, setView] = useState("detail");
  const base = state.bookings.filter((b) => b.status !== "취소" && inRange(b.datetime.slice(0, 10), from, to) && (!partnerF || b.facility === partnerF) && (!catF || b.category === catF));
  const refunded = state.bookings.filter((b) => b.status === "취소" && inRange(b.datetime.slice(0, 10), from, to)).reduce((s, b) => s + b.sales, 0);
  const totalSales = base.reduce((s, b) => s + b.sales, 0); const totalCredits = base.reduce((s, b) => s + b.credits, 0); const totalSettle = base.reduce((s, b) => s + b.settle, 0);
  let rows, cols;
  if (view === "detail") { rows = base; cols = [{ key: "datetime", label: "이용일시" }, { key: "resNo", label: "예약번호" }, { key: "member", label: "회원명" }, { key: "facility", label: "시설명" }, { key: "className", label: "수업명" }, { key: "people", label: "인원", render: (b) => b.people + "명" }, { key: "credits", label: "크레딧 사용", render: (b) => cc(b.credits) }, { key: "sales", label: "실매출", align: "right", render: (b) => won(b.sales) }, { key: "settle", label: "센터 정산액", align: "right", render: (b) => won(b.settle) }]; }
  else { const keyFn = view === "byDate" ? (b) => b.datetime.slice(0, 10) : view === "byWeek" ? (b) => weekKey(b.datetime.slice(0, 10)) : (b) => b.datetime.slice(0, 7); const map = {}; base.forEach((b) => { const k = keyFn(b); (map[k] = map[k] || { k, credits: 0, sales: 0, settle: 0, count: 0 }); map[k].credits += b.credits; map[k].sales += b.sales; map[k].settle += b.settle; map[k].count++; }); rows = Object.values(map).sort((a, b) => b.k.localeCompare(a.k)); cols = [{ key: "k", label: view === "byDate" ? "이용일" : view === "byWeek" ? "주차" : "월" }, { key: "count", label: "건수", render: (r) => r.count + "건" }, { key: "credits", label: "크레딧 사용", render: (r) => cc(r.credits) }, { key: "sales", label: "실매출", align: "right", render: (r) => won(r.sales) }, { key: "settle", label: "센터 정산액", align: "right", render: (r) => won(r.settle) }]; }
  const toolbar = <><input className="input" type="date" value={from} onChange={(e) => setFrom(e.target.value)} /><span className="muted">~</span><input className="input" type="date" value={to} onChange={(e) => setTo(e.target.value)} /><select className="input" value={partnerF} onChange={(e) => setPartnerF(e.target.value)}><option value="">업체 전체</option>{state.partners.map((p) => <option key={p.id}>{p.facility}</option>)}</select><select className="input" value={catF} onChange={(e) => setCatF(e.target.value)}><option value="">카테고리 전체</option>{CATS.map((c) => <option key={c}>{c}</option>)}</select></>;
  return <div><PageHead title="매출 현황" desc="크레딧 사용 기반 매출입니다. (1c = 3,000원 · 센터 정산 1c = 2,400원 고정)" />
    <div className="grid" style={{ gridTemplateColumns: "repeat(4, 1fr)", marginBottom: 14 }}>
      <div className="card"><div className="stat-label">기간 총 매출</div><div className="stat-value">{won(totalSales)}</div></div>
      <div className="card"><div className="stat-label">크레딧 사용량</div><div className="stat-value">{cc(totalCredits)}</div></div>
      <div className="card"><div className="stat-label">환불액</div><div className="stat-value" style={{ color: "var(--red)" }}>{won(refunded)}</div></div>
      <div className="card"><div className="stat-label">센터 정산액 합계</div><div className="stat-value">{won(totalSettle)}</div></div>
    </div>
    <SubTabs tabs={[["detail", "건별"], ["byDate", "일별"], ["byWeek", "주별"], ["byMonth", "월별"]]} value={view} onChange={setView} />
    <DataTable columns={cols} rows={rows} toolbar={toolbar} csvName={"sales_" + view + "_" + TODAY + ".csv"} emptyText="해당 조건의 매출이 없습니다." />
  </div>;
}

            <div className="field"><label>내용 <span className="muted" style={{ fontWeight: 400 }}>({body.length}/100)</span></label><textarea className="input" rows="3" maxLength={100} value={body} onChange={(e) => setBody(e.target.value)} placeholder="내용을 입력하세요" /></div>

            </div>
          </div>
          <div className="card">
            <div className="section-title">발송 시점 (Timing)</div>
            <div style={{ display: "flex", gap: 20, marginBottom: timing === "sched" ? 12 : 0 }}>{radioRow("now", "즉시 발송", timing, setTiming)}{radioRow("sched", "예약 발송", timing, setTiming)}</div>
            {timing === "sched" && <div className="grid" style={{ gridTemplateColumns: "1fr 1fr", gap: 12 }}><input className="input" type="date" value={schedDate} onChange={(e) => setSchedDate(e.target.value)} /><input className="input" type="time" value={schedTime} onChange={(e) => setSchedTime(e.target.value)} /></div>}
          </div>
          {canEdit && <button className="btn btn-primary btn-block" style={{ padding: "13px" }} disabled={!title.trim() || !body.trim() || (target === "개별 선택" && selIds.length === 0)} onClick={() => setConfirm(true)}>미리보기 및 발송</button>}
        </div>
        <div style={{ position: "sticky", top: 16 }}><div className="card"><div className="section-title">실시간 미리보기</div><PushPhonePreview title={title} body={body} /></div></div>
      </div>

      <div style={{ marginTop: 20 }}>
        <div className="section-title">발송 내역</div>
        <DataTable columns={histCols} rows={state.pushCampaigns} search={(c) => [c.name]} searchPlaceholder="캠페인명 검색" csvName={"push_campaigns_" + TODAY + ".csv"} emptyText="발송 내역이 없습니다." />
      </div>
    </div>}

    {drawer && <PushTriggerDrawer trigger={drawer.trigger} isNew={drawer.isNew} dispatch={dispatch} toast={toast} onClose={() => setDrawer(null)} />}
    {confirm && <Modal title="캠페인 발송 확인" onClose={() => setConfirm(false)}>
      <div style={{ lineHeight: 1.8, color: "var(--text-2)", marginBottom: 14 }}>정말로 이 캠페인을 발송하시겠습니까? 발송 후에는 취소가 불가능할 수 있습니다.</div>
      <div className="card" style={{ background: "var(--bg-2)", padding: 14 }}>
        <DetailRow k="발송 대상 수" v={<b>약 {fmt(targetCount)}명</b>} />
        <DetailRow k="메시지 제목" v={title || "제목 없음"} />
        <DetailRow k="발송 시점" v={timing === "sched" ? (schedDate ? schedDate + " " + (schedTime || "09:00") + " 예약" : "예약 (시간 미설정)") : "즉시 발송"} />
      </div>
      <div className="modal-actions"><button className="btn btn-outline" onClick={() => setConfirm(false)}>취소하기</button><button className="btn btn-primary" onClick={send}>발송 승인 및 실행</button></div>
    </Modal>}
  </div>;
}

function BannerDetailView({ banner, isNew, dispatch, toast, canEdit, onBack }) {
  const [f, setF] = useState(isNew
    ? { name: "", frequency: BANNER_FREQ[0], status: "노출", start: "", end: "", image: "", linkUrl: "" }
    : { name: banner.name || "", frequency: banner.frequency || BANNER_FREQ[0], status: banner.status || "노출", start: banner.start || "", end: banner.end || "", image: banner.image || "", linkUrl: banner.linkUrl || "" });
  const ok = f.start && f.end;
  const save = () => {
    if (!ok) { toast("노출 기간은 필수입니다."); return; }
    const item = { ...f, name: f.name.trim() };
    if (isNew) { dispatch({ type: "ADD_BANNER", item }); toast("배너" + (item.name ? " '" + item.name + "'" : "") + " 등록"); }
    else { dispatch({ type: "UPDATE_BANNER", id: banner.id, patch: item }); toast("배너 수정 완료"); }
    onBack();
  };

  return <div>
    <div style={{ display: "flex", justifyContent: "space-between", alignItems: "center", gap: 12, flexWrap: "wrap", marginBottom: 20 }}>
      <div style={{ display: "flex", alignItems: "center", gap: 14 }}>
        <button onClick={onBack} style={{ display: "inline-flex", alignItems: "center", gap: 4, border: "none", background: "none", cursor: "pointer", color: "var(--primary)", fontSize: 13, padding: 0 }}><span className="msym" style={{ fontSize: 18 }}>arrow_back</span>목록으로</button>
        <div className="page-title" style={{ marginBottom: 0 }}>{isNew ? "신규 배너 등록" : "배너 상세 설정"}</div>
        {!isNew && bannerStatusBadge(bannerStatus({ ...banner, ...f }))}
      </div>
    </div>

    <div className="grid" style={{ gridTemplateColumns: "1.6fr 1fr", gap: 20, alignItems: "start" }}>
      <div style={{ display: "flex", flexDirection: "column", gap: 16 }}>
        <div className="card">
          <div className="section-title">기본 정보</div>
          <div className="field"><label>배너명 <span className="muted" style={{ fontWeight: 400 }}>(선택 · 관리용 구분명 · {f.name.length}/50)</span></label><input className="input" maxLength={50} value={f.name} onChange={(e) => setF({ ...f, name: e.target.value })} placeholder="배너 식별용 이름 (실제 배너에는 노출되지 않음)" /></div>
          <div className="grid" style={{ gridTemplateColumns: "1fr 1fr" }}>
            <div className="field"><label>노출 빈도</label><select className="input" value={f.frequency} onChange={(e) => setF({ ...f, frequency: e.target.value })}>{BANNER_FREQ.map((x) => <option key={x}>{x}</option>)}</select></div>
            <div className="field"><label>상태</label><div style={{ display: "flex", gap: 16, alignItems: "center", height: 38 }}><label className="checkbox-row" style={{ cursor: "pointer" }}><input type="radio" name="bstatus" checked={f.status === "노출"} onChange={() => setF({ ...f, status: "노출" })} />노출</label><label className="checkbox-row" style={{ cursor: "pointer" }}><input type="radio" name="bstatus" checked={f.status === "비노출"} onChange={() => setF({ ...f, status: "비노출" })} />비노출</label></div></div>
          </div>
          <div className="field" style={{ marginBottom: 0 }}><label>노출 기간 <span className="req">*</span></label><div className="inline" style={{ alignItems: "center" }}><input className="input" type="date" value={f.start} onChange={(e) => setF({ ...f, start: e.target.value })} /><span className="muted">~</span><input className="input" type="date" value={f.end} onChange={(e) => setF({ ...f, end: e.target.value })} /></div></div>
        </div>

        <div className="card">
          <div className="section-title">크리에이티브</div>
          <div className="field"><label>이미지 업로드</label>
            <div style={{ border: "2px dashed var(--border-2)", borderRadius: 12, padding: 24, display: "flex", flexDirection: "column", alignItems: "center", gap: 8, background: "var(--bg-1)", cursor: "pointer" }} onClick={() => toast("이미지 업로드는 데모에서 지원되지 않습니다.")}>
              <div style={{ width: 44, height: 44, borderRadius: 99, background: "var(--primary-bg)", display: "flex", alignItems: "center", justifyContent: "center", color: "var(--primary)" }}><span className="msym">upload_file</span></div>
              <div style={{ fontWeight: 600, fontSize: 13 }}>클릭하여 업로드하거나 드래그하세요</div>
              <div className="muted" style={{ fontSize: 12, color: "var(--text-3)" }}>PNG, JPG, WebP (최대 1080×450px, 2MB)</div>
            </div>

          <div className="field" style={{ marginBottom: 0 }}><label>버튼 링크 URL <span className="muted" style={{ fontWeight: 400 }}>(배너 클릭 시 이동)</span></label><input className="input" value={f.linkUrl} onChange={(e) => setF({ ...f, linkUrl: e.target.value })} placeholder="https://ullo.kr/event/..." /></div>
        </div>

        {canEdit && <div style={{ display: "flex", justifyContent: "space-between", alignItems: "center", borderTop: "1px solid var(--border-1)", paddingTop: 16 }}>
          <div className="muted" style={{ fontSize: 12, display: "flex", alignItems: "center", gap: 4 }}><span className="msym" style={{ fontSize: 16 }}>info</span>변경 사항은 저장 시 즉시 반영됩니다.</div>
          <div style={{ display: "flex", gap: 8 }}><button className="btn btn-outline" onClick={onBack}>취소</button><button className="btn btn-primary" style={{ display: "inline-flex", alignItems: "center", gap: 4 }} disabled={!ok} onClick={save}><span className="msym" style={{ fontSize: 16 }}>save</span>설정 저장</button></div>
        </div>}
      </div>

      <div style={{ position: "sticky", top: 16 }}>
        <div className="card">
          <div className="section-title" style={{ display: "flex", alignItems: "center", gap: 6 }}><span style={{ width: 8, height: 8, borderRadius: 99, background: "var(--primary)" }} />실시간 미리보기</div>
          <BannerPhonePreview image={f.image} />
        </div>
      </div>
    </div>
  </div>;
}

    { key: (b) => bannerStatus(b), label: "상태", align: "center", render: (b) => bannerStatusBadge(bannerStatus(b)) },

      <PageHead title="마케팅 · 배너 관리" desc="앱 홈 화면 상단에 노출되는 홍보 배너를 관리합니다." />
      {canEdit && <button className="btn btn-primary" style={{ display: "inline-flex", alignItems: "center", gap: 4 }} onClick={() => setCreating(true)}><span className="msym" style={{ fontSize: 18 }}>add</span>신규 배너 등록</button>}
    </div>
    <SubTabs tabs={[["전체", "전체"], ["노출중", "노출중"], ["예정", "예정"], ["종료", "종료"], ["대기", "대기"]]} value={tab} onChange={setTab} />
    <DataTable columns={cols} rows={rows} search={(b) => [b.name]} searchPlaceholder="배너명 검색" csvName={"banners_" + TODAY + ".csv"} emptyText="배너가 없습니다." />

  const totalPrice = filtered.reduce((s, r) => s + r.price, 0);

  const selectedMember = selectedMemberId != null ? { ...PAY_USER_DETAILS[selectedMemberId], status: memberStatus[selectedMemberId] } : null;
  const PER = 5;

  return <div>
    <PageHead title="결제 관리 · 결제 내역" desc="회원들의 유료 플랜 결제 데이터를 관리합니다. (PG수수료 3.4% 차감 기준)" />

      <div style={{ display: "flex", alignItems: "center", gap: 8 }}><input className="input" type="date" value={from} onChange={(e) => setFrom(e.target.value)} /><span className="muted">~</span><input className="input" type="date" value={to} onChange={(e) => setTo(e.target.value)} /></div>

      <span className="muted">총 {filtered.length}건</span>
      <button className="btn btn-outline btn-sm" onClick={exportCsv}><span className="msym" style={{ fontSize: 18 }}>download</span>엑셀 다운로드</button>
    </div>
    <div className="card p-tight"><div className="table-wrap"><table>
      <thead><tr>
        <th>회원명</th><th>결제일시</th><th>플랜명</th><th style={{ textAlign: "right" }}>크레딧(C)</th><th style={{ textAlign: "right" }}>결제액(원)</th><th style={{ textAlign: "right" }}>PG수수료(원)</th><th style={{ textAlign: "right" }}>실수취액(원)</th><th>결제수단</th><th style={{ textAlign: "center" }}>상태</th>

    <RefundMemberModal member={selectedMember} canEdit={canEdit} onSave={saveOverride} onClose={() => setSelectedId(null)} />

}

// 텍스트 입력 시 자동완성 드롭다운 콤보박스
function CDCombo({ value, onText, onPick, options, placeholder, disabled, mono }) {
  const [open, setOpen] = useState(false);
  const [hl, setHl] = useState(-1);
  const wrapRef = useRef(null);
  useEffect(() => {
    const h = (e) => { if (wrapRef.current && !wrapRef.current.contains(e.target)) setOpen(false); };
    document.addEventListener("mousedown", h);
    return () => document.removeEventListener("mousedown", h);
  }, []);
  const q = (value || "").trim().toLowerCase();
  const matches = q ? options.filter((o) => o.label.toLowerCase().includes(q)) : options;
  const pick = (o) => { onPick(o); setOpen(false); setHl(-1); };
  const onKey = (e) => {
    if (disabled) return;
    if (e.key === "ArrowDown") { e.preventDefault(); setOpen(true); setHl((i) => Math.min(i + 1, matches.length - 1)); }
    else if (e.key === "ArrowUp") { e.preventDefault(); setHl((i) => Math.max(i - 1, 0)); }
    else if (e.key === "Enter" && open && hl >= 0 && matches[hl]) { e.preventDefault(); pick(matches[hl]); }
    else if (e.key === "Escape") { setOpen(false); }
  };
  return <div ref={wrapRef} style={{ position: "relative" }}>
    <input className={"input" + (mono ? " mono" : "")} value={value} disabled={disabled} placeholder={placeholder}
      onChange={(e) => { onText(e.target.value); setOpen(true); setHl(-1); }}
      onFocus={() => !disabled && setOpen(true)} onKeyDown={onKey} style={{ paddingRight: 32 }} autoComplete="off" />
    {!disabled && <span className="msym" style={{ position: "absolute", right: 8, top: "50%", transform: "translateY(-50%)", color: "var(--text-3)", pointerEvents: "none", fontSize: 22 }}>arrow_drop_down</span>}
    {open && !disabled && <div style={{ position: "absolute", top: "calc(100% + 4px)", left: 0, right: 0, zIndex: 30, background: "var(--bg-1)", border: "1px solid var(--border-1)", borderRadius: 8, boxShadow: "0 8px 24px rgba(0,0,0,.14)", maxHeight: 220, overflowY: "auto", padding: 4 }}>
      {matches.length === 0
        ? <div className="muted" style={{ padding: "10px 12px", fontSize: 13 }}>일치하는 항목이 없습니다 · 입력값으로 신규 등록</div>
        : matches.map((o, i) => <div key={o.label + i} onMouseDown={(e) => { e.preventDefault(); pick(o); }} onMouseEnter={() => setHl(i)}
            style={{ padding: "8px 10px", borderRadius: 6, cursor: "pointer", background: i === hl ? "var(--bg-3)" : "transparent", display: "flex", flexDirection: "column", gap: 1 }}>
            <span style={{ fontSize: 13, fontWeight: 600 }}>{o.label}</span>
            {o.sub && <span className="muted mono" style={{ fontSize: 11 }}>{o.sub}</span>}
          </div>)}
    </div>}
  </div>;
}

      </div>
      <div style={{ display: "flex", justifyContent: "flex-end", gap: 8, padding: "16px 24px", borderTop: "1px solid var(--border-1)", flexShrink: 0, background: "var(--bg-2)" }}>
        <button className="btn btn-outline" onClick={onClose}>닫기</button>
      </div>
    </div>
  </div>;
}

function ClassDiscountPage({ toast, canEdit, go }) {
  const [list, setList] = useState(CLASS_DISCOUNT_MOCK);
  const [dtype, setDtype] = useState(""); const [stat, setStat] = useState(""); const [q, setQ] = useState(""); const [drawer, setDrawer] = useState(null);
  let _cdSeq = 100;

  const filtered = list.filter((r) => (!dtype || r.dtype === dtype) && (!stat || (stat === "적용중" ? r.on : !r.on)) && (!q || r.className.includes(q) || r.center.includes(q)));
  const total = list.length, alwaysCnt = list.filter((r) => r.dtype === "상시할인").length, timeCnt = list.filter((r) => r.dtype === "시간대별").length;
  const toggle = (id) => { setList((l) => l.map((r) => r.id === id ? { ...r, on: !r.on } : r)); const t = list.find((r) => r.id === id); toast && toast(t.className + " 할인 " + (t.on ? "중지" : "적용")); };
  const reset = () => { setDtype(""); setStat(""); setQ(""); };
  const saveDiscount = (data) => {
    if (drawer.isNew) { setList((l) => [{ ...data, id: ++_cdSeq + Date.now() }, ...l]); toast && toast("'" + data.className + "' 할인 설정 추가"); }
    else { setList((l) => l.map((r) => r.id === drawer.item.id ? { ...r, ...data } : r)); toast && toast("'" + data.className + "' 할인 설정 수정"); }
    setDrawer(null);
  };

  return <div>
    <div style={{ display: "flex", justifyContent: "space-between", alignItems: "flex-start", gap: 12, flexWrap: "wrap" }}>
      <PageHead title="할인 관리 · 수업 할인 관리" desc={<span>할인 적용 중인 수업 <b style={{ color: "var(--primary)" }}>{total}</b>개 · 상시할인 <b style={{ color: "var(--primary)" }}>{alwaysCnt}</b>개 · 시간대별 자동할인 <b style={{ color: "var(--primary)" }}>{timeCnt}</b>개</span>} />
      {canEdit && <button className="btn btn-primary" style={{ display: "inline-flex", alignItems: "center", gap: 4 }} onClick={() => setDrawer({ isNew: true })}><span className="msym" style={{ fontSize: 18 }}>add</span>새 할인 설정</button>}
    </div>

    <div className="toolbar">
      <select className="input" value={dtype} onChange={(e) => setDtype(e.target.value)}><option value="">할인유형 전체</option><option value="상시할인">상시할인</option><option value="시간대별">시간대별 자동할인</option></select>
      <select className="input" value={stat} onChange={(e) => setStat(e.target.value)}><option value="">적용상태 전체</option><option value="적용중">적용중</option><option value="중지됨">중지됨</option></select>
      <input className="input" placeholder="수업명·센터명 검색" value={q} onChange={(e) => setQ(e.target.value)} />
      <button className="btn btn-outline btn-sm" onClick={reset}>초기화</button>
      <div className="spacer" /><span className="muted">총 {filtered.length}건</span>
    </div>

    <div className="card p-tight"><div className="table-wrap"><table>
      <thead><tr>
        <th>센터명</th><th>수업명</th><th>할인유형</th><th>할인조건</th><th style={{ textAlign: "right" }}>할인율(%)</th><th style={{ textAlign: "right" }}>정상가 → 할인가(C)</th><th style={{ textAlign: "center" }}>적용상태</th>
      </tr></thead>
      <tbody>{filtered.length === 0 ? <tr><td colSpan={7} className="empty">조건에 맞는 수업 할인이 없습니다.</td></tr> : filtered.map((r) => <tr key={r.id}>
        <td><a className="link" style={{ fontWeight: 600 }} onClick={() => setDrawer({ mode: "center", center: r.center, region: r.region })}>{r.center}</a><div className="muted" style={{ fontSize: 11, marginTop: 2 }}>{r.region}</div></td>
        <td><a className="link" style={{ fontWeight: 600, color: "var(--text-1)" }} onClick={() => setDrawer({ item: r })}>{r.className}</a><div className="mono muted" style={{ fontSize: 11, marginTop: 2 }}>{r.code}</div></td>
        <td>{cdTypeBadge(r.dtype)}</td>
        <td className="muted">{r.condition}</td>
        <td className="mono" style={{ textAlign: "right", color: "var(--green)", fontWeight: 700, fontSize: 15 }}>{r.rate}%</td>
        <td className="mono" style={{ textAlign: "right" }}><span className="muted" style={{ textDecoration: "line-through", opacity: .6 }}>{r.normalC}C</span> <span className="msym" style={{ fontSize: 14, color: "var(--text-3)", verticalAlign: "middle", margin: "0 2px" }}>arrow_forward</span> <b>{discPrice(r.normalC, r.rate)}C</b></td>
        <td style={{ textAlign: "center" }}><button className={"switch" + (r.on ? " on" : "")} disabled={!canEdit} onClick={() => toggle(r.id)} style={{ display: "inline-block", verticalAlign: "middle" }} /></td>
      </tr>)}</tbody>
    </table></div></div>

    <div className="grid" style={{ gridTemplateColumns: "repeat(3, 1fr)", marginTop: 16 }}>
      <div className="card"><div style={{ display: "flex", alignItems: "center", gap: 6, color: "var(--primary)", marginBottom: 8 }}><span className="msym" style={{ fontSize: 20 }}>trending_up</span><b>할인 효율성</b></div><div className="muted" style={{ fontSize: 13, lineHeight: 1.6 }}>할인 적용 후 평균 예약률이 24% 상승했습니다. 특히 시간대별 자동할인의 전환율이 가장 높습니다.</div></div>
      <div className="card"><div style={{ display: "flex", alignItems: "center", gap: 6, color: "var(--orange)", marginBottom: 8 }}><span className="msym" style={{ fontSize: 20 }}>notifications_active</span><b>종료 예정 알림</b></div><div className="muted" style={{ fontSize: 13, lineHeight: 1.6 }}>다음 주 월요일부터 3개 수업의 자동할인 규칙이 종료됩니다. 연장 설정을 검토하세요.</div></div>
      <div className="card"><div style={{ display: "flex", alignItems: "center", gap: 6, color: "var(--green)", marginBottom: 8 }}><span className="msym" style={{ fontSize: 20 }}>verified</span><b>자동화 상태</b></div><div className="muted" style={{ fontSize: 13, lineHeight: 1.6 }}>모든 자동할인 시스템이 정상 작동 중입니다. 실시간 가격 변동 엔진이 100% 가동되고 있습니다.</div></div>
    </div>

    {drawer && (drawer.mode === "center"
      ? <CenterDiscountDrawer center={drawer.center} region={drawer.region} rows={list.filter((x) => x.center === drawer.center)} onClose={() => setDrawer(null)} />
      : <ClassDiscountDrawer item={drawer.item} isNew={drawer.isNew} onClose={() => setDrawer(null)} onSave={saveDiscount} />)}
  </div>;
}

const PARENT_OF = {}; NAV.forEach((g) => (g.children || []).forEach((c) => (PARENT_OF[c.key] = g.key)));

function App() {
  const [state, dispatch] = useReducer(reducer, initialState);
  const [view, setView] = useState("login"); // login | apply | admin
  const [user, setUser] = useState(null);
  const [page, setPage] = useState("dashboard");
  const [openGroups, setOpenGroups] = useState({
    "help-center": true,
    partner: true,
    customer: true,
    settle: true,
    payment: true,
    credit: true,
    discount: true,
    marketing: true
  });
  const [toasts, setToasts] = useState([]);
  const [collapsed, setCollapsed] = useState(false);
  const toast = useCallback((msg) => { const id = uid(); setToasts((t) => [...t, { id, msg }]); setTimeout(() => setToasts((t) => t.filter((x) => x.id !== id)), 3800); }, []);
  const [navParam, setNavParam] = useState(null);
  useEffect(() => {
    const onKey = (e) => {
      if (e.key !== "Escape") return;
      const overlays = document.querySelectorAll(".modal-overlay, .noti.rpanel");
      const top = overlays[overlays.length - 1];
      if (top) top.click();
    };
    document.addEventListener("keydown", onKey);
    return () => document.removeEventListener("keydown", onKey);
  }, []);
  const go = useCallback((key, param) => { setPage(key); setNavParam(param != null ? param : null); const par = PARENT_OF[key]; if (par) setOpenGroups((g) => ({ ...g, [par]: true })); }, []);

  if (view === "apply") return <ApplyPage onBack={() => setView("login")} />;
  if (!user) return <LoginPage accounts={state.adminAccounts} onLogin={(u) => { setUser(u); setView("admin"); }} onApply={() => setView("apply")} />;

  const canEdit = user.role !== "뷰어";
  const C = { state, dispatch, toast, canEdit, currentUser: user, go };
  const PAGES = {
    dashboard: <Dashboard state={state} dispatch={dispatch} go={go} toast={toast} canEdit={canEdit} />,
    "notice-list": <NoticeListPage {...C} />, "partner-manual": <PartnerManualPage {...C} />, faq: <FaqPage {...C} />, qna: <QnaPage {...C} initCat={navParam} />, claims: <ClaimsPage {...C} />,
    "partner-list": <PartnerListPage {...C} initQuery={navParam} />, "partner-manage": <PartnerManagePage {...C} />, "class-manage": <ClassManagePage {...C} />, "partner-benefit": <PartnerBenefitPage {...C} />, reviews: <ReviewsPage {...C} />,
    "member-list": <MemberListPage {...C} initQuery={navParam} />, "member-manage": <MemberManagePage {...C} />, "member-benefit": <MemberBenefitPageV2 {...C} />,
    settlement: <SettlementPage {...C} />, fee: <FeeSettingPage {...C} />, "discount-coupon": <CouponPanel {...C} />,
    "bookings-all": <BookingsAll {...C} initQuery={navParam} />, "sales-status": <SalesStatus state={state} />, "payment-history": <PaymentHistoryPage state={state} canEdit={canEdit} toast={toast} />, "payment-refund": <PaymentRefundPage canEdit={canEdit} toast={toast} />,
    "credit-overview": <CreditOverviewPage {...C} />, "credit-grant": <div><PageHead title="크레딧 관리 · 개별 지급" desc="회원을 검색해 크레딧을 지급합니다." /><CreditGrantPanel {...C} /></div>,
    "credit-bulk": <div><PageHead title="크레딧 관리 · 일괄 지급" desc="조건에 맞는 회원에게 일괄 지급합니다." /><CreditBulkPanel {...C} /></div>,
    "credit-deduct": <div><PageHead title="크레딧 관리 · 차감 / 반환" desc="회원 크레딧을 차감·반환·삭제합니다." /><CreditDeductPanel {...C} /></div>,
    "credit-coupon": <div><PageHead title="크레딧 관리 · 쿠폰 관리" desc="크레딧 지급 쿠폰을 생성·관리합니다." /><CouponPanel {...C} /></div>,
    "credit-log": <CreditLogPage state={state} />, "credit-expire": <div><PageHead title="크레딧 관리 · 크레딧 소멸 관리" desc="크레딧 소멸 기준과 예정 현황을 관리합니다." /><CreditExpirePanel {...C} /></div>,
    "credit-plan": <CreditPlanPage state={state} />,
    "discount-promo": <PromotionPage {...C} />, "discount-class": <ClassDiscountPage {...C} />,
    "notice-send": <MessageSendPage {...C} />, "notice-auto": <AutoMessagePage {...C} />, "notice-modal": <ModalManagePage {...C} />, "marketing-push": <PushSendPage {...C} />, "marketing-banner": <BannerPage {...C} />,
    accounts: <AccountPage {...C} />, "common-code": <CommonCodePage {...C} />,
  };
  return <div className="layout">
    <aside className={"sidebar" + (collapsed ? " collapsed" : "")}>
      <div className="sidebar-top">
        {!collapsed && <img src="logo.svg" alt="ullo" className="sidebar-logo-img" onClick={() => go("dashboard")} />}
        <button className="sidebar-toggle" onClick={() => setCollapsed((c) => !c)} title={collapsed ? "사이드바 펼치기" : "사이드바 접기"}><span className="msym" style={{ fontSize: 18 }}>{collapsed ? "chevron_right" : "chevron_left"}</span></button>
      </div>
      {NAV.map((g) => {
        if (!g.children) return <button key={g.key} className={"nav-item" + (page === g.key ? " active" : "")} onClick={() => go(g.key)} title={collapsed ? g.label : undefined}><span className="msym" style={{ fontSize: 20 }}>{g.icon}</span>{!collapsed && <span>{g.label}</span>}</button>;
        const open = !collapsed && !!openGroups[g.key]; const childActive = g.children.some((c) => c.key === page);
        return <div key={g.key}><button className={"nav-item" + (childActive && !open ? " active" : "")} onClick={() => { if (collapsed) { setCollapsed(false); setOpenGroups((s) => ({ ...s, [g.key]: true })); } else setOpenGroups((s) => ({ ...s, [g.key]: !s[g.key] })); }} title={collapsed ? g.label : undefined}><span className="msym" style={{ fontSize: 20 }}>{g.icon}</span>{!collapsed && <span>{g.label}</span>}{!collapsed && <span className={"msym chev" + (open ? " open" : "")} style={{ fontSize: 16 }}>chevron_right</span>}</button>{open && <div>{g.children.map((c) => <button key={c.key} className={"nav-subitem" + (page === c.key ? " active" : "")} onClick={() => go(c.key)}>{c.label}</button>)}</div>}</div>;
      })}
      <div className="sidebar-bottom">{collapsed
        ? <div style={{ display: "flex", flexDirection: "column", alignItems: "center", gap: 10 }}><div className="sidebar-avatar" title={user.name}>{user.name.slice(0, 1)}</div><button className="btn btn-outline btn-sm" style={{ padding: "6px 8px" }} title="로그아웃" onClick={() => { setUser(null); setView("login"); setPage("dashboard"); }}><span className="msym" style={{ fontSize: 18 }}>logout</span></button></div>
        : <><div style={{ fontWeight: 700, marginBottom: 2 }}>{user.name} {roleBadge(user.role)}</div><div style={{ color: "var(--text-3)", fontSize: 12, marginBottom: 10 }}>{user.id}</div><button className="btn btn-outline btn-sm btn-block" onClick={() => { setUser(null); setView("login"); setPage("dashboard"); }}>로그아웃</button></>}</div>
    </aside>
    <main className={"main" + (collapsed ? " collapsed" : "")}>{PAGES[page] || PAGES.dashboard}</main>
    <div className="toast-wrap">{toasts.map((t) => <div key={t.id} className="toast">{t.msg}</div>)}</div>
  </div>;
}
ReactDOM.createRoot(document.getElementById("root")).render(<App />);
</script>
</body>
</html>
